plugins { id 'com.android.application' }
def vCode = (System.getenv("VERSION_CODE") ?: "1") as Integer
def vName = System.getenv("VERSION_NAME") ?: "dev"
android {
    namespace 'ir.arvanping.mahghasi'
    compileSdk 34
    defaultConfig {
        applicationId "ir.arvanping.mahghasi"
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName vName
        buildConfigField "String", "UPDATE_URL", "\"https://raw.githubusercontent.com/meisamodin/mah-ghasi/main/update.json\""
        buildConfigField "String", "UPDATE_URL3", "\"https://cdn.jsdelivr.net/gh/meisamodin/mah-ghasi@dl/update.json\""
        buildConfigField "String", "UPDATE_URL2", "\"https://meisamodin.github.io/mah-ghasi/update.json\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file(System.getenv("KS_FILE") ?: "release.jks")
            storePassword System.getenv("KS_PASS") ?: ""
            keyAlias System.getenv("KS_ALIAS") ?: "mahghasi"
            keyPassword System.getenv("KS_PASS") ?: ""
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
