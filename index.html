<style>
:root{--bg:#fff5f8;--card:#ffffff;--tx:#1f2937;--mu:#7b7f8c;--pk:#e11d48;--pk2:#ec4899;--gr:#10b981;--pu:#8b5cf6;--bd:#fde2e8;--soft:#fff1f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}


:root[data-theme="dark"]{--bg:#1b0f14;--card:#2a1820;--tx:#fbe8ee;--mu:#c3a0ac;--bd:#4a2a36;--soft:#35202a;color-scheme:dark}
:root[data-theme="dark"] body{background:#1b0f14}
.shr{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}.shr button{border:0;color:#fff;border-radius:20px;padding:8px 16px;cursor:pointer;font-family:inherit;box-shadow:0 2px 6px #0002}.shr button span{font-size:13px;font-weight:700}.obth{position:absolute;top:10px;inset-inline-end:10px}.th{margin-inline-start:auto;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:8px 10px;font-size:18px;cursor:pointer}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(135deg,#fff6f8,#fdeaf3 60%,#f6ecff) fixed;color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;min-height:100vh}
#app{max-width:460px;margin:0 auto;padding:14px 14px 100px}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:48px;height:48px;border-radius:14px;background:#fff;object-fit:contain;border:1px solid var(--bd)}
header b{font-size:20px;display:block;white-space:nowrap}header .th{padding:6px 8px;font-size:16px}header small{color:var(--pk);font-size:12px}
.card{background:var(--card);box-shadow:0 6px 20px #e11d4814;border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:15px}
.mu{color:var(--mu);font-size:12.5px;line-height:1.9}
.week{display:flex;gap:6px;justify-content:space-between}
.wd{flex:1;text-align:center;padding:8px 0;border-radius:14px;font-size:11px;color:var(--mu)}
.wd b{display:block;font-size:15px;color:var(--tx)}
.wd.on{background:var(--pk);color:#fff}.wd.on b{color:#fff}
.dot{width:6px;height:6px;border-radius:50%;margin:3px auto 0;background:var(--bd)}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600}
.dialwrap{position:relative;width:min(300px,100%);margin:10px auto;touch-action:pan-y}
.dialwrap svg{width:100%;height:auto;display:block;touch-action:pan-y;user-select:none}
.mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.mid .n{font-size:54px;font-weight:800;line-height:1.1}
.row{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:16px;padding:12px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;background:linear-gradient(135deg,var(--pk),var(--pk2));color:#fff}
.btn.o{background:var(--card);color:var(--pk);border:1.5px solid var(--bd)}
.step{width:44px;flex:none;font-size:20px;padding:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.yi i{display:block;aspect-ratio:1;border-radius:2px}
.mini{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 6px;text-align:center;font-size:12px;color:var(--mu)}
.mini b{display:block;color:var(--tx);font-size:13px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pk);border-color:var(--pk);color:#fff}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--soft);margin-bottom:8px;border-inline-start:4px solid var(--pk)}
.note.g{border-color:var(--gr)}.note.p{border-color:var(--pu)}
.note .ic{font-size:22px}.note b{font-size:13.5px}.note div div{font-size:12.5px;color:var(--mu);line-height:1.8}
.bar{height:10px;border-radius:9px;background:linear-gradient(90deg,#8b5cf6 0 14%,#10b981 14% 40%,#f59e0b 40% 60%,#e11d48 60%);position:relative;margin:14px 0}.bar i{position:absolute;top:-5px;width:6px;height:20px;border-radius:4px;background:var(--tx);transform:translateX(-50%)}
nav button{font-size:10.5px!important}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:460px;width:100%}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:6px 0;border-radius:14px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pk);background:var(--soft);font-weight:600}
textarea,input[type=date],input[type=number],input[type=text],input[type=time],input[type=password],select{width:100%;border:1.5px solid var(--bd);border-radius:14px;padding:10px;font:inherit;background:var(--card);color:var(--tx)}
input[type=range]{width:100%;accent-color:var(--pk)}
.lab{display:flex;justify-content:space-between;font-weight:600;font-size:13.5px;margin:12px 0 4px}
.breath{width:130px;height:130px;margin:10px auto;border-radius:50%;background:radial-gradient(circle,var(--pu),var(--pk2));display:grid;place-items:center;color:#fff;font-weight:600;transition:transform 4s ease-in-out;box-shadow:0 0 40px #8b5cf655}
.toast{position:fixed;inset:auto 0 90px 0;margin:auto;width:max-content;max-width:90%;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px}
@media (prefers-reduced-motion:reduce){.breath{transition:none}}
@media print{.noprint,nav,#nav{display:none!important}body{background:#fff!important}}/* v39 soft buttons + light glass nav */
.btn{background:linear-gradient(180deg,#ffffff38,#ffffff00 55%),linear-gradient(135deg,#f43f5e,var(--pk2));border-radius:18px;box-shadow:0 6px 16px #e11d4838,inset 0 1px 0 #ffffff55;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.96);box-shadow:0 2px 8px #e11d4838}
.btn.o{background:linear-gradient(180deg,var(--card),var(--soft));border:1.5px solid var(--bd);box-shadow:0 3px 10px #e11d4810,inset 0 1px 0 #ffffffaa}
.chip{box-shadow:0 2px 6px #e11d4810;transition:transform .12s,box-shadow .12s}.chip:active{transform:scale(.95)}
.chip.on{background:linear-gradient(180deg,#ffffff30,#ffffff00 55%),linear-gradient(135deg,var(--pk),var(--pk2));box-shadow:0 4px 12px #e11d4833}
.card{border-radius:24px;box-shadow:0 8px 24px #e11d4812;transition:transform .12s}.card[data-a]:active{transform:scale(.97)}
nav{box-shadow:0 -6px 24px #e11d4812}nav button{transition:transform .12s,background .2s}nav button:active{transform:scale(.94)}
nav button.on{background:linear-gradient(180deg,var(--soft),#fff);box-shadow:inset 0 0 0 1px #e11d4822}

 اگه بیماری کلیه داری نخور.":"Bloating or diarrhea (especially with lactose), acne in some people. Don't take it if you have kidney disease.","کراتین مونوهیدرات":"Creatine monohydrate","پرمطالعه‌ترین مکمل ورزشیه؛ قدرت و حجم عضله رو با تمرین مقاومتی بالا می‌بره و برای خانم‌ها هم بی‌خطره.":"The most studied sports supplement; it raises strength and muscle size with resistance training and is safe for women too.","روزی ۳ تا ۵ گرم، هر ساعتی، با آب فراوان. نوع «مونوهیدرات» کافیه. نیازی به دوره‌ی لودینگ نیست. ممکنه ۱ تا ۲ کیلو وزن آب اضافه کنه که چربی نیست":"3 to 5 grams per day, at any time, with plenty of water. The monohydrate type is enough. No loading phase is needed. It may add 1 to 2 kg of water weight, which is not fat","؛ موقع کاهش وزن ترازو رو گول می‌زنه، ولی مضر نیست.":"; it fools the scale during weight loss but is not harmful.","نفخ یا ورم خفیف اوایل مصرف. اگه مشکل کلیه داری یا داروی کلیوی می‌خوری نخور.":"Mild bloating or swelling early on. Don't take it if you have kidney problems or take kidney medication.","گینر (مس گینر)":"Gainer (mass gainer)","فقط اگه با غذا نمی‌تونی کالری هدفت (":"Only if you can't eat your target calories (",") رو بخوری. گینرها معمولاً قند زیاد دارن.":") from food. Gainers usually contain a lot of sugar.","روزی ۱ وعده بین غذاها، نه همه‌ی دوز پشت سر هم. جایگزین ارزون‌تر و سالم‌تر: شیک خونگی با ۳۰۰ میلی‌لیتر شیر، ۱ موز، ۳ قاشق جو دوسر و ۱ قاشق کره‌ی بادام‌زمینی (حدود ۵۰۰ کیلوکالری).":"1 serving a day between meals, not the whole dose in one go. A cheaper and healthier alternative: a homemade shake with 300 ml milk, 1 banana, 3 spoons of oats and 1 spoon of peanut butter (about 500 kcal).","نفخ، افزایش چربی دور شکم اگه زیاد مصرف بشه، و قند بالا برای دیابتی‌ها.":"Bloating, more belly fat if overused, and high sugar for people with diabetes.","امگا ۳ (روغن ماهی)":"Omega-3 (fish oil)","اگه هفته‌ای ۲ بار ماهی نمی‌خوری، برای قلب، التهاب و گاهی کم شدن درد قاعدگی کمک می‌کنه.":"If you don't eat fish twice a week, it helps the heart, inflammation per. Keep apart from iron and calcium.","اینوزیتول (میو-اینوزیتول)":"Inositol (myo-inositol)","در PCOS ممکنه به تعادل هورمون‌ها و قند کمک کنه.":"In PCOS it may help balance hormones and blood sugar.","معمولاً ۲ گرم دو بار در روز در مطالعه‌ها؛ فقط با تجویز یا هماهنگی پزشک زنان.":"Usually 2 grams twice a day in studies; only with a prescription or your gynecologist's agreement.","نفخ و اسهال خفیف در دوز بالا.":"Mild bloating and diarrhea at high doses.","پسیلیوم (فیبر)":"Psyllium (fiber)","کمک می‌کنه سیرتر بمونی و یبوست و نفخ کم بشه.":"Helps you stay full and reduces constipation and bloating.","اگه یبوست یا نفخ داری و فیبر غذایی کمه، کمک می‌کنه.":"Helps if you have constipation or bloating and low dietary fiber.","۵ گرم (۱ قاشق چای‌خوری) با یک لیوان بزرگ آب، شروع از نصف دوز.":"5 grams (1 teaspoon) with a large glass of water, start with half a dose.","نفخ اوایل مصرف. اگه آب کم بخوری یبوست بدتر می‌شه. حداقل ۲ ساعت از داروها فاصله بنداز.":"Bloating early on. If you drink little water, constipation gets worse. Keep at least 2 hours apart from medications.","پروبیوتیک":"Probiotic","اگه نفخ، اسهال یا یبوست مکرر داری ممکنه کمک کنه؛ شواهدش متوسطه و به نوع سویه بستگی داره.":"It may help if you have frequent bloating, diarrhea or constipation; the evidence is moderate and depends on the strain.","یک عدد در روز طبق برچسب، ترجیحاً با غذا؛ ماست پروبیوتیک هم گزینه‌ی خوبیه.":"One a day as labeled, preferably with food; probiotic yogurt is also a good option.","نفخ موقت در هفته‌ی اول. با نقص ایمنی شدید نخور.":"Temporary bloating in the first week. Don't take it with severe immune deficiency.","کلاژن":"Collagen","برای پوست و مفصل مطالعه‌های محدود و متوسطی داره؛ ضروری نیست.":"Limited and moderate studies for skin and joints; not essential.","حدود ۱۰ گرم در روز، با ویتامین C.":"About 10 grams per day, with vitamin C.","طعم بد، نفخ خفیف. جای پروتئین کامل (وی/گوشت) رو نمی‌گیره.":"Bad taste, mild bloating. It does not replace complete protein (whey/meat).","کافئین یا پیش‌تمرین":"Caffeine tment)","فشار خون: نمک رو کم کن، ورزش متوسط انتخاب کن و تمرین‌های سنگین با حبس نفس نکن":"Blood pressure: cut back on salt, choose moderate exercise and avoid heavy lifts with breath-holding","تیروئید: نتیجه‌ی کاهش یا افزایش وزن ممکنه کندتر باشه، آزمایش‌هات رو پیگیری کن":"Thyroid: weight loss or gain may be slower; follow up on your tests","PCOS: کربوهیدرات‌های کامل (نان جو و سنگک، حبوبات) رو به قند و آرد سفید ترجیح بده و تمرین مقاومتی خیلی کمک می‌کنه":"PCOS: prefer whole carbs (barley and sangak bread, legumes) over sugar and white flour; resistance training helps a lot","درد یا آسیب مفصل: حرکتی که درد داره رو انجام نده، اسکوات و لانج رو نیمه‌عمق بزن و اگه ادامه داشت به پزشک مراجعه کن":"Joint pain or injury: don't do any movement that hurts, do squats and lunges half-depth and see a doctor if it continues","⚠️ حواست باشه":"⚠️ Keep in mind","برنامه‌ی":"Plan:","کیلوکالری در روز ·":"kcal per day ·","روز ورزش در هفته":"exercise days per week","با وارد کردن دور کمر، باسن و مچ تحلیل کامل‌تر می‌شه.":"Entering waist, hip and wrist gives a fuller analysis.","با روش بر پایه‌ی توده‌ی بدون چربی (کچ‌مک‌آردل) متابولیسم پایه‌ات حدود":"With the lean-mass-based method (Katch-McArdle) your basal metabolism is estimated at about","برآورد می‌شه؛ این دو عدد کمی با هم فرق دارن چون هر دو تخمینن.":"; these two numbers differ a little because both are estimates.","حدود ۲۰٪ کمتر از مصرفت، که معمولاً ۰٫۲۵ تا ۰٫۵ کیلو در هفته کم می‌کنه. کاهش سریع‌تر برای سلامتت و چرخه‌ات خوب نیست.":"About 20% less than your usage, which usually loses 0.25 to 0.5 kg per week. Faster loss is not good for your health and cycle.","حدود ۳۵۰ کیلوکالری بیشتر از مصرفت، برای افزایش حدود ۰٫۲۵ کیلو در هفته (بیشتر عضله).":"About 350 kcal above your usage, for a gain of about 0.25 kg per week (mostly muscle).","برابر مصرف روزانه‌ات.":"Equal to your daily usage.","با این روند رسیدن به وزن هدف حدود":"At this pace, reaching your target weight takes about","هفته":"weeks","طول می‌کشه.":".","⚖️ تحلیل بدن":"⚖️ Body analysis","وضع ost of the day","بیش از ۴ ساعت در روز تو شبکه‌های اجتماعی‌ام":"I spend more than 4 hours a day on social media","وقت مشخصی برای استراحت و تفریح دارم":"I have set time for rest and fun","تو ماه چند بار با دوستان یا خانواده می‌گردم":"I get together with friends or family several times a month","تنها و منزوی می‌شم":"I feel lonely and isolated","مصرف نمک و روغن رو کنترل می‌کنم":"I control my salt and oil intake","معاینه‌ی پزشکی یا آزمایش سالانه رو انجام نمی‌دم":"I skip medical checkups or yearly tests","خوابت وضعیت خوبی داره. همین برنامه‌ی ثابت رو نگه دار.":"Your sleep is in good shape. Keep the same routine.","ساعت خواب و بیداری ثابت، یه ساعت دوری از گوشی قبل خواب، اتاق تاریک و خنک و پرهیز از کافئین بعد از ظهر کمک می‌کنه. تو دوره‌ی PMS خواب بیشتری لازمه.":"A fixed sleep and wake time, an hour away from your phone before bed, a dark and cool room and avoiding afternoon caffeine help. You need more sleep during PMS.","تغذیه‌ات متعادله؛ ادامه بده.":"Your nutrition is balanced; keep going.","سه وعده‌ی منظم، پروتئین و سبزی بیشتر، آب کافی و کم کردن قند و فست‌فود رو شروع کن. آهن‌دارها (عدس، اسفناج، جگر) تو دوران پریود خوبه.":"Start with three regular meals, more protein and vegetables, enough water and less sugar and fast food. Iron-rich foods (lentils, spinach, liver) are good during your period.","تحرکت خوبه.":"Your activity is good.","روزی ۲۰ تا ۳۰ دقیقه پیاده‌روی با نرمش گردن و کمر شروع کن. تو روزهای پریود و PMS ورزش سبک مثل یوگا و پیاده‌روی بهتره.":"Start with a 20 to 30 minute walk and neck and back stretches. During period and PMS days, light exercise such as yoga and walking is better.","خلق و حالت خوبه.":"Your mood is good.","کارهای کوچیک لذت‌بخش، نور آفتاب، حرکت و صحبت با یه آدم مطمئن کمک می‌کنه. اگه بیشتر از دو هفته ادامه داشت یا زندگی روزمره‌ات رو مختل کرد، حتماً با روانشناس یا پزشک صحبت کن.":"Small enjoyable things, sunshine, movement and talking to a trusted person help. If it lasts more than two weeks or disrupts your daily life, definitely talk to a psychologist or doctor.","استرست قابل مدیریته.":"Your stress is manageable.","تمرین تنفس (تو بخش PMS هست)، محدود کردن اخبار و کافئین و نوشتن نگرانی‌ها رو امتحان کن. اگه اضطراب ادامه‌دار بود با مشاور صحبت کن.":"Try breathing exercises (in the PMS section), limiting news and caffeine and writing down worries. If anxiety continues, talk to a counselor.","انرژیت خوبه.":"Your energy is good.","پروتئین و آهن کافی، خواب منظم و آب رو تقویت کن. اگه خستگی، رنگ‌پریدگی و ریزش مو با هم هست، آزمایش آهن (فریتین)، ویتامین D و تیروئید رو با پزشک چک کن.":"Strengthen protein and iron intake, regular sleep and water. If fatigue, paleness and hair loss come together, check iron (ferritin), vitamin D and thyroid with your doctor.","علائم قاعدگی‌ات ملایمه.":"Your period symptoms are mild.","کمپرس گرم، کم کردن نمک و کافئین، منیزیم و ورزش سبک کمک می‌کنه. تب PMS رو ببین. اگه دردها خیلی شدیده یا خونریزی زیاده، به پزشک زنان مراجعه کن.":"A heating pad, less salt and caffeine, magnesium and light exercise help. See the PMS tab. If pain is very severe or bleeding is heavy, see a gynecologist.","گوارش و دردهات وضعیت خوبی داره.":"Your digestion and pain are in good shape.","فیبر و آب کافی، غذای آروم‌تر و کم کردن غذاهای تحریک‌کننده رو امتحان کن. سردرد یا درد مکرر رو یادداشت کن و به پزشک نشون بده.":"Try fiber and enough water, eating slower and cutting irritating foods. Note down frequent headaches or pain and show them to your doctor.","پوست و مویت سالمه.":"Your skin and hair are healthy.","آب کافی، پروتئین، روی و آهن و محافظت از آفتاب رو ادامه بده. جوش‌های قبل پریود معمولاً از تغییر هورمون‌هاست.":"Keep up enough water, protein, zinc and iron and sun protection. Pre-period breakouts are usually from hormonal changes.","عادت‌های روزانه‌ات خوبه.":"Your daily habits are good.","کافئین رو کم کن، روزی چند دقیقه نور آفتاب بگیر، زمان شبکه‌های اجتماعی رو محدود کن و برای استراحت و دیدن آدم‌ها وقت بذار. چکاپ سالانه رو فراموش نکن.":"Cut back on caffeine, get a few minutes of sunlight a day, limit social media time and make time for rest and seeing people. Don't forget a yearly checkup.","۹۰ سوال کوتاه درباره‌ی خواب، تغذیه، حال و علائم بدنت. هر سوال رو برای ۲ هفته‌ی اخیر جواب بده. جواب‌ها فقط روی گوشی خودت می‌مونه.":"90 short questions about your sleep, nutrition, mood and body symptoms. Answer each for the past 2 weeks. Your answers stay only on your phone.","قبلی":"Previous","بعدی":"Next","پایان و دیدن نتیجه":"Finish and see result","تست سلامت ماه قاسی":"Mah Ghasi Health Test","بخش":"Section","از ۱۰:":"of 10:","الان نه، بعداً":"Not now, later","خوب":"Good","نیازمند توجه":"Needs attention","نیازمند اقدام":"Needs action","وضعیت کلی‌ات خوبه":"Your overall status is good","کلاً متوسطه و چند بخش نیاز به توجه داره":"Overall it's average and a few areas need attention","چند بخش نیاز به اقدام داره":"Several areas need action","یه چیز مهم":"One important thing","گفتی گاهی افکار آسیب زدن به خودت یا نبودنت به ذهنت میاد. تنها اینو تحمل نکن؛ با یه نفر مورد اعتمادت یا یه روانشناس حرف بزن. تو ایران می‌تونی با اورژانس اجتماعی (۱۲۳) تماس بگیری و اگه خطر فوریه با ۱۱۵.":"You said thoughts of hurting yourself or not being here sometimes come to mind. Don't bear this alone; talk to someone you trust or a psychologist. In Iran you can call the social emergency line (123), and if there is immediate danger call 115.","🎯 اولویت‌های تو":"🎯 Your priorities","این بخش اولویت اول توئه.":"This area is your first priority.","تب PMS برات مفیده":"The PMS tab is useful for you","تمرین تنفس، پلی‌لیست آرامش و پیام به پارتنر اونجاست.":"Breathing exercises, a calming playlist and a message to your partner are there.","نتیجه‌ی تست سلامت":"Health test result","امتیاز کلی سلامت":"Overall health score","از ۱۰۰":"out of 100","این تحلیل آموزشیه و جای تشخیص پزشک رو نمی‌گیره.":"This analysis is educational and does not replace a doctor's diagnosis.","ورود به برنامه":"Enter the app","درد شدید قاعدگی":"Severe period pain","دردم ناگهانی و خیلی شدیده، طوری که نمی‌تونم راه برم یا بایستم":"My pain is sudden and very severe, so I can't walk or stand","همراه با غش، تب بالا یا استفراغ مداوم هست":"It comes with fainting, high fever or constant vomiting","درد با مسکن معمولی کم نمی‌شه":"The pain doesn't ease with ordinary painkillers","دردم از پریودهای قبلی خیلی بیشتر شده":"My pain is much worse than in previous periods","بین پریودها یا موقع رابطه هم درد دارم":"I have pain between periods or during intercourse","درد باعث می‌شه نتونم سر کار یا مدرسه برم":"The pain keeps me from going to work or school","کمپرس گرم روی شکم، دوش آب گرم، پیاده‌روی سبک، دمنوش بابونه یا زنجبیل و کم کردن نمک و کافئین کمک می‌کنه. برای مسکن، طبق دستور روی بسته یا نظر پزشک و داروساز عمل کن.":"A warm compress on the belly, a hot shower, light walking, chamomile or ginger tea and less salt and caffeine help. For painkillers, follow the package directions or your doctor's or pharmacist's advice.","خونریزی زیاد":"Heavy bleeding","هر ۱ تا ۲ ساعت یه نوار بهداشتی کامل پر می‌شه":"A full pad fills every 1 to 2 hours","سرگیجه شدید، ضعف، تپش قلب یا رنگ‌پریدگی دارم":"I have severe dizziness, weakness, palpitations or paleness","باردار هستم یا احتمالش رو می‌دم":"I am or might be pregnant","لخته‌های بزرگ‌تر از یه سکه می‌ندازم":"I pass clots bigger than a coin","پریودم بیشتر از ۷ روز طول می‌کشه":"My period lasts more than 7 days","چند دوره‌ی پشت سر هم خونریزی زیاد داشتم":"I've had heavy bleeding several cycles in a row","مایعات و غذای آهن‌دار (عدس، اسفناج، گوشت قرمز) بخور، استراحت کن و آزمایش آهن و فریتین بده. خونریزی زیاد مکرر رو حتماً به پزشک بگو.":"Drink fluids and eat iron-rich food (lentils, spinach, red meat), rest, and get iron and ferritin tested. Always tell a doctor about repeated heavy bleeding.","تأخیر یا نیامدن پریود":"Late or missed period","درد شدید یک طرف شکم یا خونریزی غیرعادی دارم":"I have severe pain on one side of my belly or unusual bleeding","احتمال بارداری هست":"Pregnancy is possible","بیشتر از ۳ ماهه پریود نشدم":"I haven't had a period for more than 3 months","اخیراً وزنم خیلی کم یا زیاد شده یا ورزش سنگین شروع کردم":"My weight recently changed a lot or I started heavy exercise","ریزش مو، جوش زیاد یا رشد موی زائد دارم":"I have hair loss, a lot of acne or excess hair growth","استرس، کم‌خوابی، تغییر وزن و ورزش سنگین می‌تونه پریود رو عقب بندازه. اگه احتمال بارداری هست، تست بارداری خونگی بزن (یک هفته بعد از تأخیر دقیق‌تره). خواب و تغذیه‌ات رو منظم کن.":"Stress, lack of sleep, weight change and heavy exercise can delay your period. If pregnancy is possible, take a home pregnancy test (more accurate one week after the delay). Keep your sleep and nutrition regular.","خونریزی بین دو پریود":"Bleeding between periods","خونریزی خیلی زیاده یا با درد شدید همراهه":"The bleeding is very heavy or comes with severe pain","بعد از رابطه خونریزی می‌کنم":"I bleed after intercourse","بیشتر از یک دوره تکرار شده":"It has happened in more than one cycle","لکه‌بینی سبک وسط چرخه یا با تغییر قرص ممکنه طبیعی باشه. تاریخ و میزانش رو یادداشت کن و اگه تکرار شد به پزشک زنان نشون بده.":"Light mid-cycle spotting or spotting when changing pills can be normal. Note the date and amount, and if it repeats show it to a gynecologist.","سردرد و میگرن":"Headache and migraine","ناگهانی و بدترین سردردی بوده که تا حالا داشتم":"It was sudden and the worst headache I've ever had","با تاری دید، ضعف یک طرف بدن، اختلال حرف زدن یا گیجی همراهه":"It comes with blurred vision, one-sided weakness, trouble speaking or confusion","با تب و سفتی گردن همراهه":"It comes with fever and a stiff neck","هفته‌ای بیشتر از ۲ بار تکرار می‌شه":"It happens more than twice a week","با مسکن معمولی خوب نمی‌شه":"It doesn't improve with ordinary painkillers","تو اتاق تاریک و ساکت استراحت کن، آب بخور، کافئین و نور صفحه رو کم کن و خواب منظم داشته باش. سردردی که همیشه قبل پریود میاد معمولاً به هورمون‌ها ربط داره.":"Rest in a dark, quiet room, drink water, cut back on caffeine and screen light, and keep a regular sleep schedule. A headache that always comes before your period is usually hormonal.","سرگیجه و ضعف":"Dizziness and weakness","غش کردم یا نزدیک بود غش کنم":"I fainted or nearly fainted","درد قفسه سینه یا تنگی نفس شدید دارم":"I have chest pain or severe shortness of breath","تپش قلب دارم":"I have palpitations","رنگم پریده و زود خسته می‌شم":"I look pale and get tired easily","خونریزی پریودم زیاده":"My period bleeding is heavy","کم غذا می‌خورم یا رژیم سخت دارم":"I eat little or follow a strict diet","وعده‌ها رو جا ننداز، آب و کمی نمک بخور، آروم از جات بلند شو و آزمایش آهن و فریتین، ویتامین B12 و تیروئید رو با پزشک چک کن.":"Don't skip meals, drink water and have a little salt, stand up slowly, and check iron and ferritin, vitamin B12 and thyroid with your doctor.","تهوع و مشکلات گوارشی":"Nausea and digestive problems","استفراغ مداوم دارم و نمی‌تونم آب بخورم":"I vomit constantly and can't keep water down","درد شدید یا سفتی شکم دارم":"I have severe belly pain or a rigid belly","خون تو استفراغ یا مدفوعم دیدم":"I saw blood in my vomit or stool","تب دارم":"I have a fever","بیشتر از ۳ روز طول کشیده":"It has lasted more than 3 days","وعده‌های کوچیک و کم‌چرب بخور، زنجبیل یا نعناع امتحان کن، از غذای چرب و تند دوری کن و مایعات کافی بنوش.":"Eat small, low-fat meals, try ginger or mint, avoid fatty and spicy food and drink enough fluids.","ترشحات غیرعادی":"Unusual discharge","تب بالا و درد شدید لگن دارم":"I have high fever and severe pelvic pain","بوی بد یا رنگ سبز یا زرد دارم":"It has a bad smell or a green or yellow color","خارش یا سوزش شدید دارم":"I have severe itching or burning","ترشحاتم غلیظ و شبیه پنیره":"My discharge is thick and like cottage cheese","ترشحاتم شفاف و کشدار و حدود وسط چرخه‌ست":"My discharge is clear and stretchy and it's around mid-cycle","لباس زیر نخی بپوش، از شوینده‌های معطر و دوش واژینال استفاده نکن و ناحیه رو خشک نگه دار. برای هر دارویی اول پزشک رو ببین.":"Wear cotton underwear, avoid scented soaps and vaginal douching, and keep the area dry. See a doctor before taking any medication.","ترشح شفاف و کشدار حدود وسط چرخه نشونه‌ی تخمک‌گذاریه و طبیعیه.":"Clear, stretchy discharge around mid-cycle is a sign of ovulation and is normal.","PMS شدید و تغییرات خلقی":"Severe PMS and mood changes","مشکلات خلقی زندگی و روابطم رو مختل کرده":"Mood problems are disrupting my life and relationships","غم یا اضطراب شدید تو ۱-۲ هفته قبل از پریود دارم":"I have intense sadness or anxiety in the 1-2 weeks before my period","هر ماه تکرار می‌شه و بعد از پریود خوب می‌شم":"It repeats every month and I feel better after my period","خواب کافی، ورزش سبک، کم کردن نمک، قند و کافئین، تمرین تنفس و پلی‌لیست آرامش (تب PMS) کمک می‌کنه. با پزشک درباره‌ی مکمل‌هایی مثل منیزیم و ویتامین B6 مشورت کن.":"Enough sleep, light exercise, less salt, sugar and caffeine, breathing exercises and the calming playlist (PMS tab) help. Talk to a doctor about supplements like magnesium and vitamin B6.","تغییر خلق قبل از پریود شایعه و معمولاً بعد از شروع پریود بهتر می‌شه.":"Mood changes before a period are common and usually improve once it starts.","گفتی گاهی افکار آسیب زدن به خودت یا نبودنت به ذهنت میاد. تنها نمون؛ همین الان با یه نفر مورد اعتمادت یا یه روانشناس حرف بزن. تو ایران می‌تونی با اورژانس اجتماعی (۱۲۳) تماس بگیری و اگه خطر فوریه با ۱۱۵.":"You said thoughts of hurting yourself or not being here sometimes come to mind. Don't stay alone with this; right now, talk to someone you trust or a psychologist. In Iran you can call the social emergency line (123), and if there is immediate danger call 115.","نفخ و ورم":"Bloating and swelling","ورم با تنگی نفس همراهه":"The swelling comes with shortness of breath","ورم پا یا صورتم ناگهانی شده":"My legs or face swelled suddenly","وزنم تو چند روز خیلی زیاد شده":"My weight rose a lot in a few days","نفخ بیشتر از ۲ هفته ادامه داره":"Bloating has continued for more than 2 weeks","نمک و غذاهای فرآوری‌شده رو کم کن، آب بیشتر بخور، موز و سبزیجات بخور و پیاده‌روی کن. نفخ قبل از پریود معمولاً طبیعیه.":"Cut back on salt and processed foods, drink more water, eat bananas and vegetables and go for walks. Bloating before a period is usually normal.","درد وسط چرخه":"Mid-cycle pain","درد ناگهانی و شدید با غش یا تب دارم":"I have sudden severe pain with fainting or fever","درد بیشتر از ۲ روز طول کشیده":"The pain has lasted more than 2 days","با خونریزی غیرعادی همراهه":"It comes with unusual bleeding","درد خفیف یک طرف شکم و کوتاهه، حدود وسط چرخه":"Mild, brief pain on one side of the belly, around mid-cycle","کمپرس گرم و استراحت کمک می‌کنه.":"A warm compress and rest help.","درد خفیف و کوتاه وسط چرخه (درد تخمک‌گذاری) شایعه و معمولاً خودش خوب می‌شه.":"Mild, brief mid-cycle pain (ovulation pain) is common and usually goes away on its own.","یه موضوع رو انتخاب کن تا چند سوال کوتاه بپرسم و بعد بگم چیکار کنی.":"Pick a topic and I'll ask a few short questions, then tell you what to do.","برای هر مورد بله یا نه رو بزن.":"Tap yes or no for each item.","نیاز به مراجعه‌ی فوری":"Needs immediate medical attention","این علائم می‌تونه جدی باشه. هرچه زودتر به پزشک یا اورژانس (۱۱۵) مراجعه کن و تنها نمون.":"These symptoms could be serious. See a doctor or call emergency services (115) as soon as possible, and don't stay alone.","تو چند روز آینده به پزشک مراجعه کن":"See a doctor in the next few days","چند نشونه‌ی نیازمند بررسی داری. یه نوبت پزشک زنان بگیر و علائم و تاریخ پریودهات رو با خودت ببر.":"You have several signs that need checking. Book a gynecologist appointment and bring your symptoms and period dates.","مراقب باش":"Be careful","فعلاً شدید به نظر نمی‌رسه، ولی اگه علائم بیشتر شد یا بیشتر از چند روز طول کشید به پزشک مراجعه کن.":"It doesn't seem severe for now, but if symptoms increase or last more than a few days, see a doctor.","نگران‌کننده به نظر نمی‌رسه":"Doesn't look worrying","طبق جواب‌هات نشونه‌ی خطری نیست و معمولاً با مراقبت ساده بهتر می‌شه.":"Based on your answers there is no warning sign and it usually improves with simple care.","🌿 چی کمک می‌کنه":"🌿 What helps","یه موضوع انتخاب کن":"Pick a topic","موضوع دیگه":"Another topic","راهنمای علائم":"Symptom guide","این راهنما آموزشیه و جای تشخیص و درمان پزشک رو نمی‌گیره.":"This guide is educational and does not replace a doctor's diagnosis and treatment.","۵ چیز که می‌بینی رو تو ذهنت اسم ببر.":"Name 5 things you can see in your mind.","۴ چیز که می‌تونی لمس کنی رو حس کن (لباست، صندلی، دستت...).":"Feel 4 things you can touch (your clothes, the chair, your hand...).","۳ صدایی که الان می‌شنوی رو پیدا کن.":"Find 3 sounds you can hear right now.","۲ بو رو حس کن، یا دو تا بوی خوب رو یادآوری کن.":"Notice 2 smells, or recall two pleasant smells.","۱ نفس عمیق و آروم بکش و شونه‌هات رو شل کن. تموم شد.":"Take 1 deep, slow breath and relax your shoulders. Done.","پاهات رو ۵ ثانیه سفت کن، بعد کامل رهاشون کن.":"Tighten your feet for 5 seconds, then release completely.","شکم و کمرت رو ۵ ثانیه منقبض کن، بعد شل کن.":"Tense your belly and lower back for 5 seconds, then relax.","مشت‌هات رو سفت کن، بعد باز کن و رها کن.":"Clench your fists, then open and release.","شونه‌هات رو تا نزدیک گوش بالا بیار، نگه دار و رها کن.":"Raise your shoulders toward your ears, hold, and release.","صورتت رو جمع کن، بعد کاملاً شل کن.":"Scrunch your face, then relax it completely.","یه نفس عمیق بکش و با بازدم، همه‌ی بدنت رو رها کن.":"Take a deep breath and release your whole body as you exhale.","الان چی بیشتر از همه اذیتم می‌کنه؟":"What is bothering me most right now?","یه چیز کوچیک که امروز ازش ممنونم چیه؟":"What is one small thing I'm thankful for today?","اگه دوستم این حس رو داشت، بهش چی می‌گفتم؟":"If my friend felt this way, what would I tell her?","چه کار کوچیکی می‌تونم بکنم تا امروز یه ذره بهتر بشم؟":"What small thing can I do to feel a little better today?","آب کافی خوردم":"I drank enough water","حرکت یا پیاده‌روی سبک کردم":"I moved or took a light walk","کافئین و شیرینی رو کم کردم":"I cut down on caffeine and sweets","دیشب خوب خوابیدم":"I slept well last night","یه کار آرامش‌بخش کردم (تنفس، موسیقی، دوش گرم)":"I did something calming (breathing, music, a warm shower)","با یه نفر حرف زدم":"I talked to someone","الان چقدر اذیتت می‌کنه؟":"How much is it bothering you now?","اگه علائم داری، شدتش رو بزن":"If you have symptoms, tap their severity","روز قبل از پریود)":"day before period)","دوره‌ی":"Cycle","میانگین":"Average","از ۱۰، بیشترین":"out of 10, highest","هر روز تو دوره‌ی PMS شدتش رو بزن تا روند دوره‌هات اینجا دیده بشه.":"Log the severity each day of your PMS phase so the trend across cycles shows up here.","PMS چند دوره پشت سر هم شدید بوده":"PMS has been severe for several cycles in a row","بهتره با پزشک زنان صحبت کنی. این روند رو نشونش بده.":"It's best to talk to a gynecologist. Show them this trend.","📊 شدت PMS امروز":"📊 Today's PMS severity","عالی! امروز از خودت خوب مراقبت کردی 💗":"Great! You took good care of yourself today 💗","✅ مراقبت امروز":"✅ Today's care","تموم شد":"Done","مرحله‌ی":"Step","بستن":"Close","۵-۴-۳-۲-۱ برای وقتی اضطراب داری و شل کردن عضلات برای وقتی بدنت منقبضه.":"5-4-3-2-1 for when you feel anxious, and muscle relaxation for when your body is tense.","👁️ ۵-۴-۳-۲-۱":"👁️ 5-4-3-2-1","💪 شل کردن عضلات":"💪 Muscle relaxation","🧘‍♀️ تمرین‌های آروم شدن":"🧘‍♀️ Calming exercises","✍️ نوشتن افکار":"✍️ Write down your thoughts","پتاسیم؛ نفخ و گرفتگی عضله رو کم می‌کنه":"Potassium; reduces bloating and muscle cramps","بادام، گردو و مغزها":"Almonds, walnuts and nuts","منیزیم و چربی خوب؛ برای خلق و خواب":"Magnesium and good fats; for mood and sleep","اسفناج و سبزی برگ‌دار":"Spinach and leafy greens","آهن و منیزیم":"Iron and magnesium","ماهی":"Fish","امگا ۳ که ضد التهابه":"Omega-3, which is anti-inflammatory","شکلات تلخ (یکی دو مربع)":"Dark chocolate (one or two squares)","جایگزین خوب برای هوس شیرینی":"A good substitute for sweet cravings","جو دوسر و غلات کامل":"Oats and whole grains","قند خون رو ثابت نگه می‌داره":"Keeps blood sugar steady","ماست و لبنیات":"Yogurt and dairy","کلسیم، مفید برای کم کردن علائم PMS":"Calcium, helpful in easing PMS symptoms","نمک زیاد":"Too much salt","نفخ و ورم رو بیشتر می‌کنه":"Increases bloating and swelling","قند و شیرینی زیاد":"Too much sugar and sweets","نوسان خلق و افت انرژی":"Mood swings and energy dips","کافئین زیاد":"Too mu  پریودت":"🔁 Your cycle and period length","فاصله‌ی اولین روز یک پریود تا اولین روز پریود بعدی (معمولاً ۲۱ تا ۳۵ روز) و تعداد روزهای خونریزی (معمولاً ۳ تا ۷). نمی‌دونی؟ مشکلی نیست، بعداً از روی ثبت‌هات خودکار تنظیم می‌کنم.":"The gap from the first day of one period to the first day of the next (usually 21 to 35 days) and the number of bleeding days (usually 3 to 7). Don't know? No problem, I'll adjust it automatically from your logs later.","طول چرخه (روز)":"Cycle length (days)","طول پریود (روز)":"Period length (days)","نمی‌دونم، پیش‌فرض (۲۸ و ۵)":"I don't know, use default (28 and 5)","📅 پریودهای قبل‌تر (اختیاری)":"📅 Earlier periods (optional)","اگه تاریخ شروع دو پریود قبلی رو یادته بزن؛ تقویم از همون اول پر می‌شه و پیش‌بینی‌ها دقیق‌تر. نمی‌دونی؟ رد شو.":"If you remember the start dates of your two previous periods, enter them; the calendar fills in from the start and predictions become more accurate. Don't know? Skip.","پریود قبل از آخری:":"Second to last period:","یکی قبل‌تر:":"One before that:","🌸 وضعیت فعلی":"🌸 Current status","برای یادآوری پریود و PMS، اجازه‌ی اعلان بده. (اعلان‌ها وقتی برنامه باز باشه نشون داده می‌شن؛ برای هشدار همیشگی بعداً از تب اعلان «تقویم گوشی» رو بگیر.)":"Allow notifications for period and PMS reminders. (Notifications show while the app is open; for permanent alerts, later get the \"Phone calendar\" from the notifications tab.)","فعال کردن اعلان":"Enable notifications","⚠️ این برنامه آموزشیه و جای پزشک رو نمی‌گیره. پیش‌بینی‌ها تقریبین و برای پیشگیری از بارداری قابل اتکا نیستن.":"⚠️ This app is educational and does not replace a doctor. Predictions are approximate and not reliable for preventing pregnancy.","شروع 🌸":"Start 🌸","رد کردن و استفاده با تنظیم پیش‌فرض":"Skip and use default settings","از ۴":"of 4","۱ عدد":"1 piece","هر روز سر یه ساعت":"Every day at the same time","خونریزی بیشتر از ۷ روز":"Bleeding for more than 7 days","خونریزی پریودت بیش از ۷ روز پشت هم ثبت شده. اگه تکرار می‌شه یا خسته و گیج هستی، یه نوبت پزشک زنان بگیر.":"You've logged more than 7 days of bleeding in a row. If it repeats or you feel tired and dizzy, book a gynecologist appointment.","خونریزی زیاد در ۱۰ روز اخیر":"Heavy bleeding in the last 10 days","چند روز «خونریزی زیاد» ثبت کردی. اگه هر ۱ تا ۲ ساعت نوار یا تامپون عوض می‌کنی، لخته‌های درشت داری یا سرگیجه و تپش قلب داری، زود به پزشک مراجعه کن.":"You logged several days of \"heavy bleeding\". If you change a pad or tampon every 1 to 2 hours, pass large clots, or have dizziness and palpitations, see a doctor soon.","درد شدید تکرارشونده":"Recurring severe pain","تو ۳۰ روز اخیر چند بار درد ۸ یا بیشتر ثبت کردی. درد شدیدی که زندگی روزمره رو مختل می‌کنه عادی نیست و ارزش بررسی پزشک زنان داره (مثلاً برای اندومتریوز).":"In the last 30 days you logged pain of 8 or more several times. Severe pain that disrupts daily life isn't normal and is worth a gynecologist's evaluation (for example for endometriosis).","لکه‌بینی بین دو پریود":"Spotting between periods","چند بار وسط چرخه لکه‌بینی ثبت کردی. اگه ادامه پیدا کرد یا بعد از رابطه بود، به پزشک بگو.":"You logged mid-cycle spotting several times. If it continues or happens after intercourse, tell a doctor.","چرخه‌ی نامنظم":"Irregular cycle","فاصله‌ی بعضی از پریودهای اخیرت کمتر از ۲۱ یا بیشتر از ۳۸ روز بوده. نامنظمی گاهی به استرس، وزن، تیروئید یا PCOS ربط داره؛ اگه چند ماه ادامه داشت با پزشک صحبت کن.":"Some of your recent period gaps were shorter than 21 or longer than 38 days. Irregularity is sometimes linked to stress, weight, thyroid or PCOS; if it continues for several months, talk to a doctor.","بیش از ۳ ماه بدون پریود":"More than 3 months without a period","از آخرین پریود ثبت‌شده‌ات بیش از ۳ ماه گذشته. اگه تاریخ ثبت‌شده درسته (و باردار یا شیرده نیستی)، حتماً به پزشک زنان مراجعه کن. اگه ثبت نکردی، تاریخ جدید رو وارد کن.":"More than 3 months have passed since your last logged period. If the logged date is right (and you're not pregnant or breastfeeding), definitely see a gynecologist. If you haven't logged it, enter the new date.","بیش از ۲ ماه از آخرین پریود":"More than 2 months since your last period","اگه پریود شدی ولی ثبت نکردی، تاریخش رو وارد کن. اگه نه، تست بارداری بزن و در صورت منفی بودن و ادامه‌ی تأخیر با پزشک مشورت کن.":"If you had a period but didn't log it, enter its date. If not, take a pregnancy test, and if it's negative and the delay continues, talk to a doctor.","فشار خون خیلی بالا":"Very high blood pressure","آخرین فشار خونت":"Your last blood pressure was","بوده. اگه سردرد شدید، تنگی نفس، درد قفسه‌ی سینه یا تاری دید داری فوراً به اورژانس برو؛ در غیر این صورت چند دقیقه استراحت کن، دوباره اندازه بگیر و با پزشک تماس بگیر.":". If you have a severe headache, shortness of breath, chest pain or blurred vision, go to emergency right away; otherwise rest a few minutes, measure again and call your doctor.","قند خون خیلی پایین":"Very low blood sugar","قند خون خیلی بالا":"Very high blood sugar","اگه هوشیاری داری یه چیز شیرین بخور و اگه علائمت (لرزش، عرق سرد، گیجی) ادامه داشت به اورژانس برو.":"If you're conscious, eat something sweet, and if your symptoms (shakiness, cold sweat, confusion) continue, go to emergency.","قند":"Sugar","خیلی بالاست. به پزشک یا اورژانس مراجعه کن، مخصوصاً اگه تشنگی شدید، تهوع یا نفس تند داری.":"is very high. See a doctor or emergency, especially if you have severe thirst, nausea or rapid breathing.","میانگین چرخه‌هات":"Your cycle average","تنظیم فعلی":"Current setting","روزه؛ با اعمال میانگین، پیش‌بینی‌ها دقیق‌تر می‌شن.":"days; applying the average makes predictions more accurate.","اعمال":"Apply","بعداً":"Later","بدنت داره کار سختی انجام می‌ده؛ امروز اجازه بده آروم‌تر باشی. استراحت هم یه جور تلاشه. 🌸":"Your body is doing hard work; let yourself be slower today. Resting is a kind of effort too. 🌸","یه نوشیدنی گرم، یه پتوی نرم و کمی مهربونی با خودت؛ امروز همین کافیه.":"A warm drink, a soft blanket and a little kindness to yourself; that's enough today.","درد و خستگی موقتیه. هر چی امروز انجام دادی، برای این شرایط عالیه.":"Pain and fatigue are temporary. Whatever you did today is great for these conditions.","نیازی نیست امروز همه‌چی رو کامل پیش ببری. فقط مراقب خودت باش.":"You don't need to do everything perfectly today. Just take care of yourself.","انرژی‌ت داره برمی‌گرده؛ زمان خوبیه برای شروع کار یا عادتی که عقب انداخته بودی. ✨":"Your energy is returning; a good time to start a task or habit you've put off. ✨","ذهنت امروز شفاف‌تره. یه کار مهم رو برای همین روزها بذار.":"Your mind is clearer today. Save an important task for these days.","قدم‌های کوچیک هر روز، مسیر بزرگی می‌سازن. امروز یه قدم بردار.":"Small steps every day build a long road. Take one step today.","بدنت سبک‌تره؛ یه پیاده‌روی تو هوای آزاد حالت رو بهتر می‌کنه.":"Your body feels lighter; a walk outdoors will lift your mood.","اوج انرژی و اعتماد به نفسته؛ امروز با آدم‌ها وقت بگذرون و کارای مهم‌ت رو انجام بده. 🌟":"You're at peak energy and confidence; spend time with people and do your important tasks today. 🌟","امروز می‌درخشی؛ از این روزها لذت ببر.":"You're glowing today; enjoy these days.","ارتباط گرفتن امروز برات راحت‌تره؛ یه تماس یا قرار خوب بذار.":"Connecting is easier for you today; plan a good call or meet-up.","حالت خوبه، ولی استراحت و آب رو فراموش نکن.":"You feel good, but don't forget rest and water.","حس‌های سخت طبیعیه و می‌گذره؛ تو مقصر نیستی. به خودت مهربون باش. 💜":"Hard feelings are normal and they pass; it's not your fault. Be kind to yourself. 💜","امروز از خودت کمتر انتظار داشته باش. یه کار کوچیک کافیه.":"Expect less of yourself today. One small thing is enough.","نفس عمیق بکش. این حس موقتیه و از ارزشت چیزی کم نمی‌کنه.":"Take a deep breath. This feeling is temporary and takes nothing from your worth.","یه آهنگ آروم، یه دمنوش و کمی تنهایی خوب می‌تونه همه‌چی رو سبک‌تر کنه.":"A calm song, a herbal tea and a bit of solitude can make everything lighter.","· ترجمه‌ی خودکار":"· auto-translated","✨ برای امروزت":"✨ For your day","چرخه‌ی قاعدگی چیست؟":"What is the menstrual cycle?","چرخه از اولین روز خونریزی یک پریود تا روز قبل از شروع پریود بعدی حساب می‌شه. در بزرگسالان معمولاً بین ۲۱ تا ۳۵ روز و خونریزی ۲ تا ۷ روز طبیعیه. مقدار کل خونریزی معمولاً حدود ۳۰ تا ۸۰ میلی‌لیتره.":"The cycle is counted from the first day of bleeding of one period to the day before the next period starts. In adults it's usually 21 to 35 days with 2 to 7 days of bleeding. Total blood loss is usually about 30 to 80 ml.","چرخه‌ی همه‌ی آدم‌ها یه‌جور نیست و ممکنه از ماهی به ماه دیگه چند روز تغییر کنه. مهم‌تر از عدد دقیق، الگوی ثابت خودته. به‌خصوص تو چند سال اول بعد از اولین پریود، نامنظمی شایعه.":"Not everyone's cycle is the same and it can vary by a few days from month to month. More important than the exact number is your own steady pattern. Irregularity is common, especially in the first few years after the first period.","چهار فاز چرخه":"The four phases of the cycle","۱) قاعدگی: ریزش دیواره‌ی رحم و خونریزی. ۲) فولیکولی: تخمدان یه تخمک رو آماده می‌کنه و انرژی معمولاً بالا می‌ره. ۳) تخمک‌گذاری: آزاد شدن تخمک، تقریباً وسط چرخه. ۴) لوتئال: رحم برای بارداری آماده می‌شه؛ اگه بارداری رخ نده هورمون‌ها افت می‌کنن و PMS ممکنه شروع بشه.":"1) Menstrual: the uterine lining sheds and bleeding occurs. 2) Follicular: the ovary prepares an egg and energy usually rises. 3) Ovulation: the egg is released, roughly mid-cycle. 4) Luteal: the uterus prepares for pregnancy; if pregnancy doesn't occur hormones drop and PMS may start.","هورمون‌های استروژن و پروژسترون تو این فازها بالا و پایین می‌شن و روی خلق، انرژی، خواب و اشتها اثر می‌ذارن؛ برای همین حالت تو یه ماه ثابت نیست.":"Estrogen and progesterone rise and fall across these phases and affect mood, energy, sleep and appetite; that's why how you feel isn't constant through the month.","تخمک‌گذاری و روزهای باروری":"Ovulation and fertile days","تخمک‌گذاری معمولاً حدود ۱۲ تا ۱۶ روز قبل از پریود بعدی اتفاق می‌افته، نه الزاماً روز ۱۴. روزهای باروری حدود ۶ روزه: ۵ روز قبل از تخمک‌گذاری تا خود اون روز، چون اسپرم تا چند روز زنده می‌مونه.":"Ovulation usually happens about 12 to 16 days before the next period, not necessarily on day 14. The fertile window is about 6 days: 5 days before ovulation up to the day itself, since sperm can live for several days.","نشانه‌ها: ترشحات شفاف و کشسان مثل سفیده‌ی تخم‌مرغ، گاهی درد خفیف یک طرف شکم، و بالا رفتن ۰٫۲ تا ۰٫۵ درجه‌ای دمای پایه بعد از تخمک‌گذاری. تست تخمک‌گذاری هم کمک می‌کنه.":"Signs: clear, stretchy discharge like egg white, sometimes mild one-sided belly pain, and a 0.2 to 0.5 degree rise in basal temperature after ovulation. Ovulation tests help too.","پیش‌بینی‌های این برنامه تقریبیه و برای جلوگیری از بارداری قابل اتکا نیست.":"This app's predictions are approximate and not reliable for preventing pregnancy.","PMS و PMDD":"PMS and PMDD","PMS مجموعه‌ی علائمیه که ۱ تا ۲ هفته قبل از پریود شروع می‌شه و معمولاً با شروع پریود بهتر می‌شه: تغییر خلق، تحریک‌پذیری، نفخ، حساسیت سینه، خستگی و میل به شیرینی.":"PMS is a set of symptoms that begins 1 to 2 weeks before a period and usually improves once it starts: mood changes, irritability, bloating, breast tenderness, fatigue and sweet cravings.","کمک‌ها: خواب منظم، ورزش سبک، کم کردن نمک، کافئین و قند، و تکنیک‌های آرام‌سازی. اگه علائم خلقی خیلی شدیده (غم و اضطراب شدید، خشم کنترل‌نشدنی یا افکار آسیب به خود)، ممکنه PMDD باشه و حتماً باید با پزشک یا روان‌پزشک صحبت کنی.":"Helpful steps: regular sleep, light exercise, less salt, caffeine and sugar, and relaxation techniques. If mood symptoms are very severe (intense sadness and anxiety, uncontrollable anger or thoughts of self-harm), it may be PMDD and you should definitely talk to a doctor or psychiatrist.","دل‌درد قاعدگی":"Period cramps","درد پریود به‌خاطر موادی به اسم پروستاگلاندینه که رحم رو منقبض می‌کنن. گرما (کیسه‌ی آب گرم)، حرکت سبک، دمنوش‌های گرم و مسکن‌های مناسب (طبق برچسب و در صورت نداشتن منع مصرف) معمولاً کمک می‌کنن.":"Period pain comes from substances called prostaglandins that make the uterus contract. Heat (a hot water bottle), light movement, warm teas and suitable painkillers (per the label and if there are no contraindications) usually help.","اگه درد خیلی شدیده و با مسکن بهتر نمی‌شه، باعث غیبت از کار یا مدرسه می‌شه، بعد از ۲۵ سالگی تازه شروع شده یا با درد حین رابطه همراهه، به پزشک زنان مراجعه کن؛ ممکنه علتی مثل اندومتریوز داشته باشه.":"If the pain is very severe and doesn't improve with painkillers, makes you miss work or school, began after age 25, or comes with pain during intercourse, see a gynecologist; it may have a cause such as endometriosis.","پریود نامنظم":"Irregular periods","دلایل شایع: استرس، کم یا زیاد شدن وزن، ورزش خیلی سنگین، مشکل تیروئید، PCOS، شیردهی، قرص‌ها و نزدیک شدن به یائسگی.":"Common causes: stress, weight loss or gain, very heavy exercise, thyroid problems, PCOS, breastfeeding, pills and approaching menopause.","وقتی باید پیگیری کنی: چرخه‌ی مکرراً کمتر از ۲۱ یا بیشتر از ۳۵ روز، نیامدن پریود برای ۳ ماه (در صورت باردار نبودن)، خونریزی خیلی زیاد یا بیش از ۷ روز. ثبت منظم تاریخ پریودها توی این برنامه به پزشک کمک می‌کنه.":"When to follow up: cycles repeatedly shorter than 21 or longer than 35 days, no period for 3 months (if not pregnant), very heavy bleeding or more than 7 days. Regularly logging period dates in this app helps your doctor.","خونریزی زیاد و کم‌خونی":"Heavy bleeding and anemia","نشانه‌های خونریزی زیاد: عوض کردن نوار یا تامپون هر ۱ تا ۲ ساعت برای چند ساعت، لخته‌های درشت‌تر از یه سکه، خونریزی بیش از ۷ روز، یا نیاز به عوض کردن نوار وسط شب.":"Signs of heavy bleeding: changing a pad or tampon every 1 to 2 hours for several hours, clots bigger than a coin, bleeding for more than 7 days, or needing to change a pad in the middle of the night.","خونریزی زیاد می‌تونه به کم‌خونی فقر آهن برسه: خستگی، رنگ‌پریدگی، سرگیجه، تپش قلب و ریزش مو. آزمایش فریتین و هموگلوبین کمک می‌کنه. غذاهای آهن‌دار (گوشت قرمز، عدس، اسفناج) با ویتامین C بهتر جذب می‌شن. آهن مکمل رو فقط با نظر پزشک بخور.":"Heavy bleeding can lead to iron-deficiency anemia: fatigue, paleness, dizziness, palpitations and hair loss. Ferritin and hemoglobin tests help. Iron-rich foods (red meat, lentils, spinach) are absorbed better with vitamin C. Take iron supplements only on your doctor's advice.","سندرم تخمدان پلی‌کیستیک (PCOS)":"Polycystic ovary syndrome (PCOS)","PCOS یه اختلال هورمونیه با علائمی مثل پریود نامنظم یا نیامدن آن، جوش و چرب شدن پوست، رشد موی زیاد و افزایش وزن. اسمش «کیست» داره ولی همه‌ی مبتلایان کیست زیاد ندارن.":"PCOS is a hormonal disorder with symptoms like irregular or missing periods, acne and oily skin, excess hair growth and weight gain. It has \"cyst\" in its name, but not everyone with it has many cysts.","تشخیص با پزشک و بر اساس علائم، آزمایش هورمون و سونوگرافیه. کم کردن وزن (در صورت اضافه‌وزن)، ورزش منظم و رژیم کم‌قند علائم رو بهتر می‌کنه و درمان‌های دارویی هم وجود داره.":"Diagnosis is by a doctor based on symptoms, hormone tests and ultrasound. Losing weight (if overweight), regular exercise and a low-sugar diet improve symptoms, and medical treatments exist too.","بهداشت دوران پریود":"Hygiene during your period","نوار بهداشتی رو هر ۴ تا ۶ ساعت عوض کن، تامپون رو حداکثر هر ۴ تا ۸ ساعت (نگه داشتن طولانی خطر سندرم شوک سمی داره) و کاپ قاعدگی رو حداکثر هر ۱۲ ساعت.":"Change a pad every 4 to 6 hours, a tampon at most every 4 to 8 hours (leaving it in longer risks toxic shock syndrome) and a menstrual cup at most every 12 hours.","دست‌ها رو قبل و بعد از تعویض بشور، از اسپری و محصولات معطر ناحیه‌ی تناسلی استفاده نکن و روزانه دوش بگیر. بوی بد غیرعادی، سوزش، خارش یا ترشح رنگی می‌تونه نشونه‌ی عفونت باشه و باید به پزشک بگی.":"Wash your hands before and after changing, don't use sprays or scented products on the genital area, and shower daily. Unusual odor, burning, itching or colored discharge may signal an infection and you should tell a doctor.","خواب، استرس و چرخه":"Sleep, stress and the cycle","استرس زیاد و کم‌خوابی می‌تونه تخمک‌گذاری رو عقب بندازه و پریود رو دیر یا نامنظم کنه. رژیم‌های خیلی کم‌کالری و ورزش بسیار سنگین هم ممکنه پریود رو قطع کنن؛ این نشونه‌ی نیاز بدن به انرژی بیشتره و نباید نادیده گرفته بشه.":"High stress and lack of sleep can delay ovulation and make periods late or irregular. Very low-calorie diets and very heavy exercise may also stop periods; this is a sign your body needs more energy and shouldn't be ignored.","۷ تا ۹ ساعت خواب، فعالیت بدنی متعادل، وعده‌های منظم و وقت گذاشتن برای آرام‌سازی از ساده‌ترین راه‌های حمایت از چرخه‌ست.":"7 to 9 hours of sleep, balanced physical activity, regular meals and time for relaxation are among the simplest ways to support your cycle.","قرص ضدبارداری و پیشگیری":"Birth control pills and prevention","قرص‌های ترکیبی باید هر روز سر یه ساعت مصرف بشن. اگه یه قرص رو فراموش کردی، دستور برگه‌ی همون قرص رو بخون یا از داروساز بپرس؛ چون بسته به نوع قرص و هفته‌ی مصرف فرق می‌کنه.":"Combination pills must be taken at the same time every day. If you forget one, read that pill's leaflet or ask a pharmacist, because it differs by pill type and week of use.","قرص از بیماری‌های مقاربتی محافظت نمی‌کنه. انتخاب روش پیشگیری باید با پزشک باشه، مخصوصاً اگه سیگار می‌کشی، میگرن با اورا داری، فشار خون بالا داری یا سابقه‌ی لخته داری. تاریخ‌های باروری این برنامه جای روش پیشگیری نیست.":"The pill doesn't protect against sexually transmitted infections. Choosing a method of prevention should be done with a doctor, especially if you smoke, have migraine with aura, high blood pressure or a history of clots. This app's fertile dates are not a contraception method.","کی حتماً باید به پزشک مراجعه کنم؟":"When should I definitely see a doctor?","فوری (اورژانس): درد شدید ناگهانی شکم، خونریزی خیلی شدید با سرگیجه یا غش، خونریزی در بارداری، تب بالا همراه با ضعف و بثورات در حین استفاده از تامپون، افکار آسیب به خود.":"Urgent (emergency): sudden severe belly pain, very heavy bleeding with dizziness or fainting, bleeding in pregnancy, high fever with weakness and rash while using a tampon, thoughts of self-harm.","در چند روز آینده: پریود نیامده بیش از ۳ ماه، خونریزی بیش از ۷ روز، درد شدید مکرر، لکه‌بینی بین دو پریود، ترشح یا بوی غیرعادی، توده در سینه، یا هر تغییر ناگهانی و نگران‌کننده در چرخه‌ت.":"In the next few days: no period for more than 3 months, bleeding for more than 7 days, repeated severe pain, spotting between periods, unusual discharge or odor, a breast lump, or any sudden worrying change in your cycle.","اطلاعات کوتاه و کاربردی":"Short and practical information","مقاله‌های آموزشی":"Educational articles","همه‌ی مقاله‌ها":"All articles","این مطالب آموزشیه و جای مشاوره‌ی پزشک رو نمی‌گیره.":"This content is educational and does not replace a doctor's advice.","این اپ توسط تیم اروان پینگ ساخته شده است.":"This app was built by the Aroonping team.","© ۱۴۰۵ / 2026 تیم اروان پینگ؛ تمامی حقوق محفوظ است.":"© 1405 / 2026 Aroonping team; all rights reserved.","یه پشتیبان خودکار پیدا شد":"An automatic backup was found","آخرین ذخیره:":"Last saved:",". می‌خوای اطلاعاتت برگرده؟":". Do you want your data restored?","بازیابی":"Restore","نه، ممنون":"No, thanks","آخرین فایل پشتیبانت:":"Your last backup file:","هنوز فایل پشتیبان نگرفتی.":"You haven't made a backup file yet.","وقت پشتیبان‌گیریه":"Time for a backup","یه فایل نگه دار تا با عوض شدن گوشی یا پاک شدن اطلاعات چیزی از دست نره.":"Keep a file so nothing is lost if you change phones or data is erased.","دانلود پشتیبان":"Download backup","آخرین ذخیره‌ی خودکار:":"Last automatic save:","بازیابی از پشتیبان خودکار":"Restore from automatic backup","هنوز نسخه‌ای ذخیره نشده.":"No version saved yet.","💾 پشتیبان خودکار":"💾 Automatic backup","برنامه خودش یه نسخه از اطلاعاتت رو توی حافظه‌ی مرورگر نگه می‌داره تا با خرابی صفحه یا پاک شدن بخشی از اطلاعات نجاتت بده. اگه کل داده‌های برنامه از تنظیمات گوشی پاک بشه این نسخه هم می‌ره؛ پس فایل پشتیبان هم نگه دار.":"The app keeps a copy of your data in the browser's storage to rescue you from a page crash or partial data loss. If all app data is cleared from phone settings this copy goes too, so keep a backup file as well.","📥 دانلود فایل پشتیبان":"📥 Download backup file","آخرین فایل پشتیبان:":"Last backup file:","🔐 پشتیبان رمزدار":"🔐 Password-protected backup","فایل با رمز خودت رمزنگاری می‌شه (AES-256). رمز رو ات شخصی‌ای همراهش نیست)، به‌روزرسانی لیست پلی‌لیست‌ها و جستجوی گوگل (فقط وقتی خودت دکمه‌اش رو بزنی و فقط همون عبارتی که نوشتی).":"The app connects to the internet only for a few general things: loading fonts, the daily motivational sentence (only the sentence text is translated and no personal data goes with it), updating the playlist list, and Google search only when you tap its button (just the phrase you typed).","یه نسخه‌ی پشتیبان خودکار هم در همون حافظه‌ی مرورگر ذخیره می‌شه. فایل پشتیبانی که خودت دانلود می‌کنی رمزنگاری نشده؛ نگهداریش با خودته.":"An automatic backup is also stored in that same browser storage. The backup file you download yourself is not encrypted; keeping it safe is up to you.","قفل رمز یا اثر انگشت فقط جلوی دید دیگران رو می‌گیره و رمزنگاری کامل اطلاعات نیست.":"The PIN or fingerprint lock only hides things from others' view and is not full data encryption.","با «پاک کردن همه‌ی داده‌ها» در تنظیمات، اطلاعات و پشتیبان خودکار از این گوشی پاک می‌شن.":"\"Delete all data\" in settings erases your data and the automatic backup from this phone.","ماه قاسی ابزار ثبت و اطلاع‌رسانیه و جای پزشک، معاینه، تشخیص یا درمان رو نمی‌گیره.":"Mah Ghasi is a logging and information tool and does not replace a doctor, examination, diagnosis or treatment.","پیش‌بینی پریود، تخمک‌گذاری و «شانس بارداری» تخمینیه و روش پیشگیری از بارداری نیست.":"Predictions of period, ovulation and \"chance of pregnancy\" are estimates and not a contraception method.","هشدارها تشخیص بیماری نیستن؛ فقط یادآوری می‌کنن که شاید لازم باشه با پزشک صحبت کنی.":"Alerts are not a diagnosis; they only remind you that you might need to talk to a doctor.","برنامه‌ی رژیم، ورزش و مکمل‌ها اطلاعات عمومیه. قبل از شروع، مخصوصاً در بارداری، شیردهی، بیماری‌های زمینه‌ای، مصرف دارو یا زیر ۱۸ سال، با پزشک یا متخصص تغذیه مشورت کن.":"The diet, exercise and supplement plan is general information. Before starting, especially in pregnancy, breastfeeding, underlying conditions, medication use or under 18, consult a doctor e are estimates and not a contraception method.","رمز پشتیبان باید حداقل ۶ حرف باشه":"The backup password must be at least 6 characters","پشتیبان رمزدار دانلود شد. رمزش رو جایی امن یادداشت کن؛ بدون رمز باز نمی‌شه":"Encrypted backup downloaded. Write down its password somewhere safe; it can't be opened without it","ساخت پشتیبان رمزدار ناموفق بود":"Creating the encrypted backup failed","اول متن یا فایل پشتیبان رمزدار رو بذار":"First paste the text or the encrypted backup file","اطلاعات بازگردانی شد":"Data restored","رمز اشتباهه یا فایل معتبر نیست":"Wrong password or the file isn't valid","🩸 دوران پریود":"🩸 Period days","آهن رو جدی بگیر: گوشت قرمز کم‌چرب، جگر، عدسی، لوبیا و سبزی‌های تیره با چند قطره لیمو. چای و قهوه رو با فاصله از غذا بخور تا جذب آهن کم نشه. آب کافی و منیزیم (بادام، موز، سبزی) می‌تونه درد رو کمتر کنه.":"Take iron seriously: lean red meat, liver, lentils, beans and dark greens with a few drops of lemon. Drink tea and coffee away from meals so iron absorption isn't reduced. Enough water and magnesium (almonds, banana, greens) can ease pain.","💜 دوره‌ی PMS":"💜 PMS phase","نیاز به شیرینی بالا می‌ره؛ به‌جای قند ساده از میوه، خرما با گردو یا شکلات تلخ استفاده کن. نمک و کافئین رو کم کن تا نفخ و تحریک‌پذیری کمتر بشه. ممکنه ۱۰۰ تا ۱۵۰ کیلوکالری بیشتر گرسنه بشی، که طبیعیه.":"Sweet cravings rise; instead of plain sugar use fruit, dates with walnuts or dark chocolate. Cut back on salt and caffeine to reduce bloating and irritability. You may be 100 to 150 kcal hungrier, which is normal.","🌙 نیمه‌ی دوم چرخه":"🌙 Second half of the cycle","متابولیسم کمی بالاتر می‌ره و ممکنه گرسنگی بیشتر بشه. پروتئین و فیبر بیشتر (حبوبات، سبزی، ماست) سیرت می‌کنه. وزن ممکنه ۱ تا ۲ کیلو بالا و پایین بشه که آب بدنه و چربی نیست.":"Metabolism rises slightly and hunger may increase. More protein and fiber (legumes, vegetables, yogurt) will keep you full. Your weight may fluctuate 1 to 2 kg, which is water, not fat.","🌸 نیمه‌ی اول چرخه":"🌸 First half of the cycle","انرژی و حساسیت به انسولین ht at least 3 times (over the last 4 weeks or more).","ثبت داری.":"entries logged.","داده‌ها هنوز برای تشخیص روند کافی نیست؛ چند هفته‌ی دیگه ادامه بده.":"There isn't enough data to detect a trend yet; keep going for a few more weeks.","وزنت سریع‌تر از حد امن (بیشتر از ۱٪ وزن در هفته) کم می‌شه. ۱۵۰ تا ۲۰۰ کیلوکالری به برنامه اضافه کن تا عضله و چرخه‌ات آسیب نبینه.":"You're losing weight faster than the safe limit (more than 1% of body weight per week). Add 150 to 200 kcal to the plan so your muscle and cycle aren't harmed.","روند عالیه؛ با همین سرعت ادامه بده.":"Great trend; keep this pace.","وزنت در چند هفته‌ی اخیر تقریباً ثابته. اول مطمئن شو ثبت‌ها منظم و هم‌شرایطن (نوسان آب قبل پریود ۱ تا ۲ کیلوئه). اگه بعد از ۳ هفته هم ثابت موند، ۱۰ دقیقه پیاده‌روی بیشتر یا ۱۰۰ کیلوکالری کمتر امتحان کن، ولی از ۱۲۰۰ پایین‌تر نرو.":"Your weight has been about flat for the last few weeks. First make sure logs are regular and under the same conditions (water fluctuation before a period is 1 to 2 kg). If it stays flat after 3 weeks, try 10 more minutes of walking or 100 fewer kcal, but don't go below 1200.","هنوز روند مشخصی دیده نمی‌شه؛ صبور باش.":"No clear trend is visible yet; be patient.","وزنت سریع‌تر از ۰٫۵ کیلو در هفته بالا می‌ره؛ بخشی‌ش احتمالاً چربیه. ۱۰۰ تا ۱۵۰ کیلوکالری کم کن.":"Your weight is rising faster than 0.5 kg per week; part of it is probably fat. Cut 100 to 150 kcal.","روند خوبیه؛ با تمرین مقاومتی ادامه بده تا بیشترش عضله باشه.":"A good trend; continue resistance training so most of it is muscle.","وزنت کم‌تر از حد انتظار بالا می‌ره. حدود ۱۵۰ کیلوکالری (مثلاً یه میان‌وعده‌ی کامل) اضافه کن.":"Your weight is rising less than expected. Add about 150 kcal (for example a full snack).","وزنت ثابته؛ همین خوبه.":"Your weight is steady; that's good.","وزنت در حال":"Your weight is","افزایش":"rising","کاهش":"falling","با سرعت":"at a rate of","کیلو در هفته‌ست. اگه قصد حفظ وزن داری، کالری رو کمی تنظیم کن.":"kg per week. If you want to maintain weight, adjust calories slightly.",
