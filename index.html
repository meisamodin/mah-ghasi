ردانی رو بزن":"File read; tap restore","تیم اروان پینگ":"Aroonping team","© 2026 تیم اروان پینگ":"© 2026 Aroonping team","ماه قاسی؛ اپ فارسی ثبت و پیش‌بینی چرخه‌ی قاعدگی، علائم، PMS و سلامت بانوان. ساخته‌ی تیم اروان پینگ.":"Mah Ghasi; a Persian app for tracking and predicting the menstrual cycle, symptoms, PMS and women's health. Built by the Aroonping team.","🌐 زبان / Language":"🌐 Language","ی":"S","د":"M","س":"T","چ":"W","پ":"T","ج":"F","ش":"S","تلگرام":"Telegram","واتس‌اپ":"WhatsApp","پیامک":"SMS","اینستاگرام":"Instagram","کپی":"Copy","بیشتر":"More","پیام آماده تو برنامه‌ی دلخواهت (تلگرام، واتس‌اپ، پیامک یا اینستاگرام) باز می‌شه، خودت مخاطب رو انتخاب می‌کنی و می‌فرستی. هیچچی بدون اجازه‌ی تو ارسال نمی‌شه.":"The ready message opens in the app you choose (Telegram, WhatsApp, SMS or Instagram); you pick the contact and send it. Nothing is sent without your permission.","متن کپی شد؛ توی دایرکت اینستاگرام بچسبون":"Text copied; paste it in Instagram Direct","کپی شد":"Copied","اسمت":"Your name","سنت":"Your age","اسم پارتنر":"Partner's name","(اختیاری)":"(optional)","اسم دارو (مثلاً قرص آهن)":"Medication name (e.g. iron pill)","اسم":"Name","اسمت (اختیاری)":"Your name (optional)","توضیح (مثلاً بعد از غذا) - اختیاری":"Note (e.g. after a meal) - optional","دور باسن (cm)":"Hip circumference (cm)","دور مچ (cm)":"Wrist circumference (cm)","دور کمر (cm)":"Waist circumference (cm)","دور گردن (cm)":"Neck circumference (cm)","رمز پشتیبان (حداقل ۶ حرف)":"Backup password (at least 6 characters)","رمز ۴ رقمی":"4-digit PIN","ساعت خواب":"Hours of sleep","سن (سال)":"Age (years)","سنت (اختیاری)":"Your age (optional)","عدد بالا":"Systolic (top)","عدد قند (mg/dL)":"Sugar value (mg/dL)","عدد پایین":"Diastolic (bottom)","متن پشتیبان اینجا نمایش داده می‌شه":"Backup text appears here","مثلاً: امروز یک عدد قرص آهن خوردم":"e.g. today I took one iron pill","مثلاً: سردرد، آهن، گزگز":"e.g. headache, iron, tingling","مثلاً: گزگز دست":"e.g. tingling hand","مقدار (مثلاً ۱ قرص، ۵۰۰ میلی‌گرم)":"Amount (e.g. 1 pill, 500 mg)","هرچی تو ذهنته بنویس. فقط روی گوشی خودته.":"Write whatever's on your mind. It stays only on your phone.","وزن امروز (کیلوگرم)":"Today's weight (kg)","وزن هدف (کیلوگرم) - اختیاری":"Goal weight (kg) - optional","قد (اینچ)":"Height (in)","قد (سانتی‌متر)":"Height (cm)","مثلاً ۱۳۲":"e.g. 132","مثلاً ۶۰":"e.g. 60","وزن (پوند)":"Weight (lb)","وزن (کیلوگرم)":"Weight (kg)","تغییر تم":"Toggle theme","حذف":"Delete","مثلاً":"e.g.","اندومتریوز":"Endometriosis","اندومتریوز یعنی بافتی شبیه جدار رحم بیرون از رحم (مثلاً روی تخمدان‌ها یا داخل لگن) رشد کنه. این بافت با هورمون‌های چرخه تحریک می‌شه و می‌تونه درد و التهاب ایجاد کنه.":"Endometriosis means tissue similar to the uterine lining grows outside the uterus (for example on the ovaries or inside the pelvis). This tissue responds to cycle hormones and can cause pain and inflammation.","نشانه‌های شایع: درد خیلی شدید پریود که با مسکن ساده بهتر نمی‌شه، درد لگن بین دو پریود، درد موقع رابطه، درد هنگام اجابت مزاج یا ادرار در روزهای پریود، خونریزی زیاد و گاهی مشکل در باردار شدن. شدت درد همیشه با شدت بیماری یکی نیست.":"Common signs: very severe period pain that doesn't ease with simple painkillers, pelvic pain between periods, pain during intercourse, pain when passing stool or urine during periods, heavy bleeding and sometimes trouble getting pregnant. How bad the pain is doesn't always match how severe the disease is.","تشخیص با پزشک زنان و معمولاً با معاینه، سونوگرافی یا MRI و گاهی روش‌های جراحی تشخیصی انجام می‌شه. درمان‌ها شامل داروهای مسکن، هورمون‌درمانی و در بعضی موارد جراحیه. اگه درد پریودت زندگی روزمره‌ات رو مختل می‌کنه، نذار «طبیعیه» بشه؛ ثبت دردها تو این برنامه رو به پزشک نشون بده.":"Diagnosis is by a gynecologist, usually with an exam, ultrasound or MRI and sometimes diagnostic surgery. Treatments include painkillers, hormonal therapy and, in some cases, surgery. If your period pain disrupts daily life, don't let it be dismissed as \"normal\"; show your pain logs from this app to your doctor.","فیبروم و پولیپ رحم":"Fibroids and uterine polyps","فیبروم تومورهای خوش‌خیم عضلانی رحمه و پولیپ زائده‌ی کوچیک روی جدار رحم یا دهانه‌ی رحمه. هر دو شایعن و بیشترشون سرطانی نیستن.":"Fibroids are benign muscle growths of the uterus, and polyps are small outgrowths on the uterine lining or cervix. Both are common and most are not cancer.","ممکنه هیچ علامتی نداشته باشن یا باعث خونریزی زیاد، پریود طولانی، لکه‌بینی بین دو پریود، فشار یا سنگینی لگن، تکرار ادرار و گاهی کم‌خونی بشن.":"They may cause no symptoms or may cause heavy bleeding, long periods, spotting between periods, pelvic pressure or heaviness, frequent urination and sometimes anemia.","تشخیص معمولاً با سونوگرافیه. اگه علامتی ندارن، ممکنه فقط تحت نظر باشن. اگه خونریزی زیاد یا فشار لگن داری، پزشک درمان دارویی یا روش‌های دیگه رو پیشنهاد می‌کنه. خونریزی بعد از یائسگی همیشه باید بررسی بشه.":"Diagnosis is usually by ultrasound. If there are no symptoms they may just be monitored. If you have heavy bleeding or pelvic pressure, your doctor may suggest medication or other procedures. Bleeding after menopause should always be checked.","تیروئید و چرخه‌ی قاعدگی":"Thyroid and the menstrual cycle","تیروئید غده‌ایه که سرعت سوخت‌وساز بدن رو تنظیم می‌کنه. کم‌کاری یا پرکاری تیروئید می‌تونه پریود رو نامنظم، سنگین، سبک یا حتی قطع کنه.":"The thyroid is a gland that regulates your body's metabolism. An underactive or overactive thyroid can make periods irregular, heavy, light or even stop them.","نشانه‌های کم‌کاری: خستگی، سردی‌پذیری، افزایش وزن، یبوست، خشکی پوست، ریزش مو و افسردگی. نشانه‌های پرکاری: تپش قلب، لرزش دست، کاهش وزن، گرمازدگی، اضطراب و بی‌خوابی.":"Signs of an underactive thyroid: fatigue, feeling cold, weight gain, constipation, dry skin, hair loss and low mood. Signs of an overactive thyroid: palpitations, trembling hands, weight loss, feeling hot, anxiety and insomnia.","آزمایش خون ساده (TSH و در صورت نیاز T4) تشخیص می‌ده. اگه پریودت نامنظمه یا چند نشونه‌ی بالا رو داری، چک تیروئید رو با پزشک مطرح کن. درمان معمولاً با قرص‌ها و پیگیری منظمه.":"A simple blood test (TSH and, if needed, T4) can diagnose it. If your periods are irregular or you have several of the signs above, ask your doctor about a thyroid check. Treatment is usually with pills and regular follow-up.","کم‌خونی فقر آهن":"Iron-deficiency anemia","در دوران قاعدگی مقداری آهن از دست می‌ره و اگه خونریزی زیاد باشه یا آهن غذا کم باشه، کم‌خونی فقر آهن شایعه. این مشکل در دختران نوجوان و زنان با خونریزی سنگین بیشتر دیده می‌شه.":"Some iron is lost during menstruation, and if bleeding is heavy or dietary iron is low, iron-deficiency anemia is common. It is seen more in teenage girls and in women with heavy bleeding.","نشانه‌ها: خستگی، رنگ‌پریدگی، سرگیجه، تپش قلب، تنگی نفس با فعالیت سبک، ریزش مو، شکننده شدن ناخن، سرد بودن دست و پا و میل به خوردن یخ یا خاک. گاهی فریتین پایینه حتی وقتی هموگلوبین هنوز طبیعیه.":"Signs: fatigue, paleness, dizziness, palpitations, shortness of breath with light activity, hair loss, brittle nails, cold hands and feet and cravings to eat ice or dirt. Sometimes ferritin is low even when hemoglobin is still normal.","تشخیص با آزمایش خون (هموگلوبین و فریتین) انجامه. غذاهای آهن‌دار مثل گوشت قرمز، جگر، عدس، لوبیا و سبزی‌های تیره با ویتامین C (لیمو، گوجه) بهتر جذب می‌شن. چای و قهوه جذب آهن رو کم می‌کنن. قرص آهن رو فقط با نظر پزشک و با دوز تعیین‌شده مصرف کن، چون زیادش هم مشکل‌سازه.":"Diagnosis is by blood test (hemoglobin and ferritin). Iron-rich foods like red meat, liver, lentils, beans and dark greens are absorbed better with vitamin C (lemon, tomato). Tea and coffee reduce iron absorption. Take iron pills only on your doctor's advice and at the prescribed dose, since too much is a problem too.","ویتامین D، B12 و کلسیم":"Vitamin D, B12 and calcium","کمبود ویتامین D تو ایران شایعه، مخصوصاً با پوشش زیاد، کار داخل ساختمون و آفتاب کم. نشانه‌ها می‌تونه خستگی، درد استخوان و عضله و ضعف باشه، ولی گاهی هیچ نشانه‌ای نداره.":"Vitamin D deficiency is common in Iran, especially with full-coverage clothing, indoor work and little sun. Signs can include fatigue, bone and muscle pain and weakness, but sometimes there are none.","ویتامین B12 تو گوشت، ماهی، تخم‌مرغ و لبنیات هست؛ گیاه‌خوارها بیشتر در خطر کمبودن. کمبودش می‌تونه خستگی، گزگز دست و پا، تغییر خلق و کم‌خونی بده. کلسیم هم از لبنیات، ماهی کوچیک با استخوان و سبزی‌های برگ‌دار تأمین می‌شه.":"Vitamin B12 is found in meat, fish, eggs and dairy; vegetarians are at higher risk of deficiency. Deficiency can cause fatigue, tingling in hands and feet, mood changes and anemia. Calcium comes from dairy, small fish with bones and leafy greens.","قبل از مصرف مکمل، آزمایش بده و دوز رو پزشک تعیین کنه؛ مصرف خودسرانه‌ی دوزهای بالا می‌تونه مضر باشه. ۱۰ تا ۲۰ دقیقه آفتاب ملایم چند بار در هفته و رژیم متنوع پایه‌ی خوبیه.":"Before taking supplements, get tested and let your doctor set the dose; taking high doses on your own can be harmful. 10 to 20 minutes of gentle sunshine several times a week and a varied diet are a good foundation.","سلامت پستان و خودآزمایی":"Breast health and self-exams","حساسیت و درد پستان قبل از پریود شایعه و به هورمون‌ها ربط داره. ماه‌به‌ماه و بعد از پریود، پستان‌ها معمولاً نرم‌تر می‌شن.":"Breast tenderness and pain before a period is common and linked to hormones. Month to month and after a period, breasts usually feel softer.","خودآزمایی ماهانه رو چند روز بعد از پایان پریود انجام بده (وقتی پستان‌ها حساسیت کمتری دارن): جلوی آینه شکل، اندازه و پوست رو نگاه کن، بعد با نوک سه انگشت و حرکت دایره‌ای، کل پستان و زیر بغل رو لمس کن.":"Do your monthly self-exam a few days after your period ends (when breasts are less tender): look at shape, size and skin in a mirror, then use the pads of three fingers in circular motions to feel the whole breast and underarm.","اگه توده‌ی جدید و سفت، تغییر شکل یا فرورفتگی پوست، ترشح خونی یا شفاف از نوک، قرمزی یا زخم یا درد یک‌طرفه‌ی مداوم دیدی، بدون نگرانی ولی بدون تأخیر به پزشک مراجعه کن. بیشتر توده‌ها خوش‌خیمن، ولی فقط پزشک می‌تونه مطمئن بشه. غربالگری با ماموگرافی طبق سن و سابقه‌ی خانوادگی با نظر پزشکه.":"If you notice a new firm lump, a change in shape or skin dimpling, bloody or clear nipple discharge, redness or sores, or constant one-sided pain, see a doctor promptly but without panic. Most lumps are benign, but only a doctor can be sure. Mammogram screening depends on age and family history, per your doctor.","عفونت‌های واژینال":"Vaginal infections","شایع‌ترین انواع: عفونت قارچی (خارش و سوزش، ترشح غلیظ و سفید شبیه پنیر)، واژینوز باکتریال (بوی ماهی‌مانند و ترشح خاکستری) و عفونت‌های مقاربتی. ترشح شفاف یا سفید بدون بو و بدون خارش معمولاً طبیعیه.":"The most common types: yeast infection (itching, burning, thick white cottage-cheese-like discharge), bacterial vaginosis (fishy odor and gray discharge) and sexually transmitted infections. Clear or white discharge with no odor and no itching is usually normal.","کمک‌ها: لباس زیر نخی، پرهیز از شوینده‌ی معطر و دوش واژینال، خشک نگه داشتن ناحیه، عوض کردن زود لباس خیس، و شستشو از جلو به عقب. بعد از مصرف آنتی‌بیوتیک ممکنه عفونت قارچی بشه.":"What helps: cotton underwear, avoiding scented soaps and douching, keeping the area dry, changing out of wet clothes quickly and washing front to back. A yeast infection can follow a course of antibiotics.","قبل از مصرف دارو (خصوصاً کرم و قرص بدون نسخه) تشخیص با پزشک بهتره، چون علائم این عفونت‌ها شبیه همه و درمانشون فرق داره. اگه تب، درد لگن یا ترشح با بوی بد و رنگ سبز/زرد داری، یا باردار هستی، حتماً ویزیت شو.":"Before taking medication (especially over-the-counter creams and pills) it's better to have a doctor diagnose it, since these infections look alike but are treated differently. If you have fever, pelvic pain or foul-smelling green or yellow discharge, or you are pregnant, be sure to be seen.","عفونت ادراری (سیستیت)":"Urinary tract infection (cystitis)","عفونت مثانه در زنان شایعه چون مجرای ادراری کوتاهه. نشانه‌ها: سوزش هنگام ادرار، نیاز مکرر و فوری به دستشویی، درد پایین شکم و گاهی ادرار کدر یا بدبو یا خونی.":"Bladder infection is common in women because the urethra is short. Signs: burning when urinating, a frequent and urgent need to go, lower belly pain and sometimes cloudy, foul-smelling or bloody urine.","کمک‌ها: آب کافی، خالی کردن مثانه بعد از رابطه، شستشو از جلو به عقب، و پرهیز از نگه داشتن ادرار. این‌ها پیشگیری رو کمک می‌کنن ولی عفونت فعال معمولاً به آنتی‌بیوتیک نیاز داره که باید پزشک تجویز کنه.":"What helps: enough water, emptying the bladder after intercourse, washing front to back and not holding urine. These help prevent it, but an active infection usually needs antibiotics prescribed by a doctor.","اگه تب، لرز، درد پهلو، تهوع و استفراغ داری یا باردار هستی، این می‌تونه نشونه‌ی عفونت کلیه باشه و نیاز به مراجعه‌ی فوری داره. علائم عفونت ادراری رو با علائم پریود یا عفونت واژینال اشتباه نگیر.":"If you have fever, chills, flank pain, nausea and vomiting, or are pregnant, this could be a kidney infection and needs prompt medical care. Don't confuse urinary infection symptoms with period or vaginal infection symptoms.","غربالگری پاپ‌اسمیر و HPV":"Pap smear and HPV screening","پاپ‌اسمیر و تست HPV سلول‌های دهانه‌ی رحم رو بررسی می‌کنن تا تغییرات پیش‌سرطانی خیلی زود پیدا بشن. سرطان دهانه‌ی رحم تقریباً همیشه با غربالگری منظم قابل پیشگیریه.":"A Pap smear and HPV test check cervical cells so precancerous changes are found very early. Cervical cancer is almost always preventable with regular screening.","معمولاً از حدود ۲۱ سالگی یا بعد از شروع رابطه، طبق نظر پزشک، غربالگری شروع می‌شه و فاصله‌ی انجامش به سن و نتیجه‌ی قبلی بستگی داره. بهتره آزمایش رو وسط پریود انجام ندی و ۲۴ تا ۴۸ ساعت قبلش رابطه، دوش واژینال یا کرم واژینال نداشته باشی.":"Screening usually starts around age 21 or after becoming sexually active, per your doctor, and the interval depends on age and your previous result. It's best not to be tested mid-period and to avoid intercourse, douching or vaginal creams for 24 to 48 hours before.","واکسن HPV در سنین نوجوانی و جوانی با نظر پزشک موجوده و از چند نوع پرخطر ویروس محافظت می‌کنه. نتیجه‌ی غیرطبیعی یعنی نیاز به پیگیری، نه لزوماً سرطان.":"The HPV vaccine is available in adolescence and young adulthood on your doctor's advice and protects against several high-risk virus types. An abnormal result means follow-up is needed, not necessarily cancer.","تست بارداری و نشانه‌های اولیه":"Pregnancy test and early signs","اولین و شایع‌ترین نشانه‌ی بارداری، عقب افتادن پریوده. نشانه‌های دیگه: حساسیت پستان، تهوع، خستگی، تکرر ادرار و گاهی لکه‌بینی خفیف.":"The first and most common sign of pregnancy is a missed period. Other signs: breast tenderness, nausea, fatigue, frequent urination and sometimes light spotting.","تست خونگی هورمون hCG ادرار رو می‌سنجه. بعد از چند روز تأخیر پریود دقیق‌تره و بهتره با ادرار صبحگاهی انجام بشه. اگه منفی بود ولی پریود نیومد، ۳ تا ۷ روز بعد دوباره امتحان کن. تست خون دقیق‌تر و زودتره.":"A home test measures the hormone hCG in urine. It is more accurate after a few days of delay and is best done with first-morning urine. If negative but your period doesn't come, retest in 3 to 7 days. A blood test is more accurate and earlier.","اگه مثبت بود، با پزشک یا ماما قرار بذار. مصرف اسید فولیک و هر مکمل دیگه رو با پزشک هماهنگ کن. درد شدید یک‌طرفه‌ی شکم، سرگیجه یا غش و خونریزی در این زمان اورژانسیه.":"If positive, book with a doctor or midwife. Coordinate folic acid and any other supplements with your doctor. Severe one-sided belly pain, dizziness or fainting, and bleeding at this time are emergencies.","آماده‌سازی برای بارداری":"Preparing for pregnancy","اگه قصد بارداری داری، ۳ ماه قبل با پزشک مشورت کن: چک وضعیت واکسن‌ها، تیروئید، قند و کم‌خونی، داروهای فعلی و مصرف اسید فولیک (با دوز تعیین‌شده‌ی پزشک).":"If you plan to get pregnant, talk to a doctor 3 months ahead: check vaccinations, thyroid, sugar and anemia, current medications and folic acid use (at the dose your doctor sets).","سیگار، قلیان و الکل رو کنار بذار، وزن متعادل داشته باش، کافئین رو محدود کن و ورزش سبک و منظم داشته باش. تو این برنامه می‌تونی روزهای باروری، دمای پایه و ترشحات رو ثبت کنی.":"Stop smoking, hookah and alcohol, keep a balanced weight, limit caffeine and exercise lightly and regularly. In this app you can log fertile days, basal temperature and discharge.","حدود ۸۵٪ زوج‌ها ظرف یک سال به بارداری می‌رسن. اگه زیر ۳۵ سالی و یک سال تلاش بی‌نتیجه بود (یا بالای ۳۵ و ۶ ماه) برای بررسی مراجعه کن؛ بررسی باید برای هر دو نفر انجام بشه.":"About 85% of couples conceive within a year. If you are under 35 and a year of trying has not worked (or over 35 and 6 months), get evaluated; both partners should be checked.","پریود بعد از زایمان و شیردهی":"Periods after birth and breastfeeding","بعد از زایمان، خونریزی نفاسی چند هفته طول می‌کشه. اولین پریود واقعی بسته به شیردهی فرق می‌کنه: در شیردهی انحصاری ممکنه ماه‌ها نیاد، ولی تخمک‌گذاری می‌تونه قبل از اولین پریود اتفاق بیفته و باردار شدن ممکنه.":"After birth, postpartum bleeding lasts a few weeks. The first true period varies with breastfeeding: with exclusive breastfeeding it may not come for months, but ovulation can happen before the first period and pregnancy is possible.","چرخه‌ها در ماه‌های اول بعد از برگشت ممکنه نامنظم، کوتاه یا بلند باشن و کم‌کم تنظیم می‌شن. تو این دوره پیش‌بینی‌های برنامه کمتر دقیقه.":"Cycles may be irregular, short or long in the first months after they return and gradually settle. In this phase the app's predictions are less accurate.","خونریزی خیلی زیاد (پر شدن نوار هر ساعت)، تب، ترشح بدبو، درد شدید شکم یا لخته‌های درشت بعد از زایمان نیاز به مراجعه‌ی فوریه. غمگینی و اضطراب شدید که بیشتر از دو هفته طول بکشه رو هم به پزشک بگو؛ افسردگی بعد از زایمان قابل درمانه.":"Very heavy bleeding (soaking a pad every hour), fever, foul-smelling discharge, severe belly pain or large clots after birth need urgent care. Intense sadness and anxiety lasting more than two weeks should also be told to a doctor; postpartum depression is treatable.","پیش‌یائسگی و یائسگی":"Perimenopause and menopause","یائسگی یعنی ۱۲ ماه پیاپی بدون پریود (معمولاً حدود ۴۵ تا ۵۵ سالگی). چند سال قبلش، دوره‌ی پیش‌یائسگی با نامنظمی چرخه، تغییر مقدار خونریزی و نوسان هورمونی شروع می‌شه.":"Menopause means 12 months in a row without a period (usually around age 45 to 55). A few years before, perimenopause begins with irregular cycles, changes in bleeding amount and hormone swings.","علائم شایع: گرگرفتگی، تعریق شبانه، بی‌خوابی، تغییر خلق، خشکی واژن، کاهش میل جنسی و مشکل تمرکز. این علائم قابل مدیریتن: لباس لایه‌لایه، کم کردن کافئین و الکل، ورزش، خواب منظم و در صورت نیاز درمان هورمونی یا غیرهورمونی با نظر پزشک.":"Common symptoms: hot flashes, night sweats, insomnia, mood changes, vaginal dryness, lower sex drive and trouble concentrating. They are manageable: layered clothing, less caffeine and alcohol, exercise, regular sleep and, if needed, hormonal or non-hormonal treatment on your doctor's advice.","تو یائسگی خطر پوکی استخوان و بیماری قلبی بالا می‌ره؛ کلسیم، ویتامین D، ورزش وزنه‌ای و چک‌آپ منظم مهمه. هر خونریزی بعد از یائسگی رو حتماً به پزشک نشون بده. اگه قبل از ۴۰ سالگی پریودت قطع شد هم باید بررسی بشه.":"After menopause the risk of osteoporosis and heart disease rises; calcium, vitamin D, weight-bearing exercise and regular checkups matter. Show any bleeding after menopause to a doctor. If your periods stop before age 40, that should also be evaluated.","اولین پریود (دوران بلوغ)":"Your first period (puberty)","اولین پریود معمولاً بین ۹ تا ۱۶ سالگی، حدود ۲ تا ۳ سال بعد از شروع رشد سینه‌ها اتفاق می‌افته. چرخه‌ها تو ۱ تا ۲ سال اول معمولاً نامنظمن و این طبیعیه.":"The first period usually comes between ages 9 and 16, about 2 to 3 years after breast growth begins. Cycles are usually irregular in the first 1 to 2 years and that is normal.","آماده باش: نوار بهداشتی یا لباس زیر مخصوص تو کیف داشته باش، خونریزی رو تو برنامه ثبت کن و یاد بگیر که تغییر نوار هر ۴ تا ۶ ساعت لازمه. درد خفیف، تغییر خلق و خستگی عادیه.":"Be prepared: keep a pad or spare underwear in your bag, log bleeding in the app and learn that a pad should be changed every 4 to 6 hours. Mild pain, mood changes and tiredness are normal.","اگه تا ۱۵ سالگی پریود نیومد، خونریزی خیلی زیاد یا خیلی طولانی داره، درد غیرقابل تحمل داره، یا چرخه بعد از دو سال هنوز خیلی نامنظمه، با پزشک صحبت کن. به نوجوان‌ها بگو چیزی برای شرم‌ساری نیست و می‌تونن از مادر یا یه بزرگ‌تر مورد اعتماد کمک بگیرن.":"If no period has come by age 15, bleeding is very heavy or very long, pain is unbearable, or cycles are still very irregular after two years, talk to a doctor. Tell teens there is nothing to be ashamed of and they can ask their mother or a trusted adult for help.","ورزش و چرخه‌ی قاعدگی":"Exercise and the menstrual cycle","ورزش منظم درد پریود، نفخ و تغییر خلق رو کم می‌کنه. تو نیمه‌ی اول چرخه انرژی معمولاً بالاتره و برای تمرین سنگین‌تر مناسبه؛ تو روزهای پریود و PMS پیاده‌روی، یوگا و کشش بهتره.":"Regular exercise reduces period pain, bloating and mood swings. In the first half of the cycle energy is usually higher and suits heavier training; on period and PMS days walking, yoga and stretching are better.","ورزش خیلی سنگین همراه با کم‌خوری می‌تونه پریود رو نامنظم یا قطع کنه و به استخوان‌ها آسیب بزنه. اگه پریودت قطع شد، انرژی دریافتی رو بیشتر کن و به پزشک بگو.":"Very heavy exercise combined with under-eating can make periods irregular or stop them and harm bones. If your period stops, raise your energy intake and tell a doctor.","گوش دادن به بدن مهمه: سرگیجه، درد قفسه‌ی سینه یا ضعف شدید نشونه‌ی توقفه. قبل و بعد از ورزش گرم کردن و سرد کردن، آب کافی و خواب ۷ تا ۹ ساعت رو فراموش نکن.":"Listening to your body matters: dizziness, chest pain or severe weakness are signs to stop. Don't forget warm-up and cool-down, enough water and 7 to 9 hours of sleep.","اضطراب و افسردگی در دختران و زنان":"Anxiety and depression in girls and women","نوسان خلق قبل از پریود شایعه، ولی غم عمیق، بی‌علاقگی به همه‌چیز، تغییر شدید خواب و اشتها، احساس بی‌ارزشی یا ناامیدی که بیشتر از دو هفته طول بکشه ممکنه افسردگی باشه. اضطراب با نگرانی کنترل‌نشدنی، تپش قلب، لرزش و بی‌خوابی خودش رو نشون می‌ده.":"Mood swings before a period are common, but deep sadness, losing interest in everything, big changes in sleep and appetite, and feeling worthless or hopeless for more than two weeks may be depression. Anxiety shows up as uncontrollable worry, palpitations, trembling and insomnia.","کمک‌ها: خواب منظم، حرکت و آفتاب، وقت گذاشتن با آدم‌های امن، محدود کردن کافئین و اخبار، و حرف زدن با کسی که بهش اعتماد داری. مشاوره و روان‌درمانی و گاهی دارو مؤثر و قابل‌اعتمادن، و کمک گرفتن نشونه‌ی ضعف نیست.":"What helps: regular sleep, movement and sunshine, time with safe people, limiting caffeine and news, and talking to someone you trust. Counseling, psychotherapy and sometimes medication are effective and reliable, and asking for help isn't a sign of weakness.","اگه افکار آسیب زدن به خودت یا مردن داری، همین الان با یه نفر مورد اعتماد حرف بزن. تو ایران می‌تونی با اورژانس اجتماعی (۱۲۳) تماس بگیری و اگه خطر فوریه با ۱۱۵. تو تنها نیستی.":"If you have thoughts of hurting yourself or dying, talk to someone you trust right now. In Iran you can call the social emergency line (123), and if there is immediate danger call 115. You are not alone.","مصرف ایمن مسکن‌ها":"Safe use of painkillers","برای دردهای پریود، مسکن‌های ضدالتهاب معمولی (مثل ایبوپروفن) اغلب مؤثرن، ولی بهتره بعد از غذا مصرف بشن. اگه زخم معده، آسم حساس به مسکن، بیماری کلیه، حساسیت دارویی یا بارداری داری، بدون نظر پزشک مصرف نکن.":"For period pain, common anti-inflammatory painkillers (like ibuprofen) are often effective, but are best taken after food. If you have a stomach ulcer, painkiller-sensitive asthma, kidney disease, drug allergies or pregnancy, don't take them without a doctor's advice.","هرگز بیشتر از دوز روی برچسب یا نظر پزشک نخور و چند نوع مسکن رو هم‌زمان بدون مشورت مصرف نکن (مثلاً چند دارو با ماده‌ی مؤثر مشابه). مصرف مداوم روزانه‌ی مسکن نیاز به بررسی علت درد داره.":"Never take more than the label or your doctor's dose, and don't combine several painkillers without advice (for example several medicines with a similar active ingredient). Using painkillers daily on an ongoing basis requires finding the cause of the pain.","اگه داروی دیگه‌ای می‌خوری یا بیماری زمینه‌ای داری، از داروساز بپرس. قرص ضدبارداری ترکیبی هم می‌تونه درد و خونریزی رو کم کنه، ولی فقط با تجویز پزشک. برای کودکان زیر ۱۸ سال هم دوز و نوع دارو با پزشک مشخص بشه.":"If you take other medication or have an underlying condition, ask a pharmacist. A combined birth control pill can also reduce pain and bleeding, but only with a doctor's prescription. For anyone under 18, the type and dose should be set by a doctor.","پیشگیری اضطراری (قرص روز بعد)":"Emergency contraception (morning-after pill)","پیشگیری اضطراری برای وقتیه که رابطه‌ی بدون محافظت یا شکست روش پیشگیری رخ داده. هرچه زودتر مصرف بشه مؤثرتره؛ بعضی انواعش تا ۳ تا ۵ روز بعد از رابطه اثر دارن ولی با گذشت زمان اثرشون کم می‌شه.":"Emergency contraception is for when unprotected intercourse or a contraception failure has happened. The sooner it is taken the more effective it is; some types work up to 3 to 5 days after intercourse, but effectiveness falls with time.","این روش جایگزین روش پیشگیری منظم نیست، سقط‌کننده نیست و از بیماری‌های مقاربتی محافظت نمی‌کنه. ممکنه پریود بعدی چند روز زودتر یا دیرتر بیاد.":"It is not a replacement for regular contraception, it does not cause abortion and it does not protect against sexually transmitted infections. Your next period may come a few days early or late.","برای انتخاب نوع و دوز مناسب با داروساز یا پزشک مشورت کن، مخصوصاً اگه شیر می‌دی یا دارو مصرف می‌کنی. اگه پریودت بیش از یک هفته دیر شد، تست بارداری بزن. استفراغ تا ۲ ساعت بعد از مصرف، یعنی باید با داروساز صحبت کنی.":"Talk to a pharmacist or doctor to choose the right type and dose, especially if you are breastfeeding or taking medication. If your period is more than a week late, take a pregnancy test. Vomiting within 2 hours of taking it means you should talk to a pharmacist.","لکه‌بینی؛ علل و نکات":"Spotting: causes and tips","لکه‌بینی یعنی خونریزی سبک‌تر از پریود. دلایل شایع: تخمک‌گذاری، شروع یا تغییر قرص‌های هورمونی، لانه‌گزینی جنین (حدود ۶ تا ۱۲ روز بعد از تخمک‌گذاری)، استرس، عفونت یا پولیپ و تغییرات هورمونی.":"Spotting is bleeding lighter than a period. Common causes: ovulation, starting or changing hormonal pills, embryo implantation (about 6 to 12 days after ovulation), stress, infection or polyps and hormone changes.","تاریخ، رنگ و مقدار لکه‌بینی رو تو برنامه ثبت کن (گزینه‌ی لکه‌بینی). این اطلاعات به تشخیص الگو کمک می‌کنه.":"Log the date, color and amount of spotting in the app (the spotting option). This information helps identify patterns.","اگه لکه‌بینی تکرار می‌شه، بعد از رابطه است، همراه با درد شدید، تب یا بوی بد هست، یا باردار هستی و خونریزی داری، به پزشک مراجعه کن. لکه‌بینی بعد از یائسگی هم همیشه باید بررسی بشه.":"If spotting repeats, happens after intercourse, comes with severe pain, fever or a bad smell, or you are pregnant and bleeding, see a doctor. Spotting after menopause should always be checked.","مو و پوست و هورمون‌ها":"Skin, hair and hormones","تغییرات هورمونی روی پوست و مو اثر می‌ذارن: جوش قبل از پریود، چرب یا خشک شدن پوست و ریزش مو. ریزش مو می‌تونه با کم‌خونی، کمبود آهن یا ویتامین D، تیروئید، استرس و PCOS هم ارتباط داشته باشه.":"Hormonal changes affect skin and hair: pimples before a period, oily or dry skin and hair loss. Hair loss can also be linked to anemia, low iron or vitamin D, thyroid problems, stress and PCOS.","مراقبت ساده: پوست رو دو بار در روز با شوینده‌ی ملایم بشور، از کرم ضدآفتاب استفاده کن، به جوش‌ها دست نزن، پروتئین و آهن کافی بخور و از کشیدن و حرارت زیاد مو پرهیز کن.":"Simple care: wash skin twice a day with a gentle cleanser, use sunscreen, don't pick at pimples, eat enough protein and iron and avoid pulling and too much heat on hair.","اگه جوش‌های شدید و مقاوم، رشد موی زیاد در صورت یا بدن، ریزش مو بیشتر از معمول، یا پریود نامنظم همراه با این‌ها داری، با پزشک (زنان یا پوست) صحبت کن؛ ممکنه PCOS یا مشکل دیگه‌ای باشه.":"If you have severe, stubborn acne, excess hair growth on the face or body, more hair loss than usual, or irregular periods along with these, talk to a doctor (gynecologist or dermatologist); it may be PCOS or something else.","باورهای غلط درباره‌ی پریود":"Common period myths","«تو پریود نباید حمام کرد یا موی سر شست»: غلطه، حمام و دوش بهداشتیه و حتی درد رو کم می‌کنه. «تو پریود نمی‌شه ورزش کرد»: ورزش سبک تا متوسط مفیده. «پریود خون کثیفه»: خون قاعدگی کثیف نیست؛ خون و بافت جدار رحمه.":"\"You can't bathe or wash your hair on your period\": false, bathing and showering are hygienic and can even ease pain. \"You can't exercise on your period\": light to moderate exercise is beneficial. \"Period blood is dirty\": it isn't; it is blood and uterine lining tissue.","«شروع بارداری تو پریود ممکن نیست»: بعید ولی ممکنه، مخصوصاً تو چرخه‌های کوتاه. «ترشح واژن همیشه نشونه‌ی بیماریه»: ترشح طبیعی بخشی از سلامته. «پریود نامنظم تو نوجوانی یعنی نازایی»: معمولاً طبیعیه و با بلوغ تنظیم می‌شه.":"\"You can't get pregnant during your period\": unlikely but possible, especially with short cycles. \"Vaginal discharge always means disease\": normal discharge is part of health. \"Irregular periods in adolescence mean infertility\": usually normal and settles with maturity.","«دوش واژینال تمیزکننده‌ست»: برعکس، تعادل طبیعی رو به هم می‌زنه و خطر عفونت رو بالا می‌بره. «درد شدید پریود عادیه و باید تحمل کرد»: درد خیلی شدید عادی نیست و ارزش بررسی داره.":"\"Douching cleans you\": on the contrary, it disrupts the natural balance and raises infection risk. \"Severe period pain is normal and must be endured\": very severe pain is not normal and is worth checking.","جستجو":"Search","مقاله‌ها، راهنمای علائم، یادداشت‌ها و تنظیمات":"Articles, symptom guide, notes and settings","مثلاً: کم‌خونی، درد تخمک‌گذاری، قفل":"e.g. anemia, ovulation pain, lock","🔎 جستجو در گوگل":"🔎 Search on Google","نتیجه‌ای تو برنامه پیدا نشد. می‌تونی تو گوگل جستجو کنی.":"No result found in the app. You can search on Google.","نتیجه‌ی آفلاین":"offline results","همه‌ی جستجوهای بالا آفلاینه و روی همین گوشی انجام می‌شه. فقط وقتی دکمه‌ی گوگل رو بزنی، همون عبارت جستجو (و فقط اون) تو مرورگر به گوگل فرستاده می‌شه؛ اطلاعات پروفایل و ثبت‌هات هرگز فرستاده نمی‌شن. نتیجه‌های گوگل جای نظر پزشک رو نمی‌گیرن.":"All searching above is offline and done on this phone. Only when you tap the Google button, that search phrase (and only that) is sent to Google in your browser; your profile and logs are never sent. Google results do not replace a doctor's opinion.","اول عبارتی بنویس":"Type a phrase first","اینترنت وصل نیست؛ جستجوی آفلاین کار می‌کنه":"No internet; offline search still works","مقاله":"Article","یادداشت":"Note","تنظیمات و بخش‌ها":"Settings and sections","زبان":"Language","قفل برنامه":"App lock","پشتیبان‌گیری":"Backup","تم تاریک و روشن":"Dark and light theme","اعلان‌ها و یادآورها":"Notifications and reminders","تقویم چرخه":"Cycle calendar","فشار خون و قند":"Blood pressure and sugar","PMS و آرام‌سازی":"PMS and relaxation","پاک کردن اطلاعات":"Erase data","واحدها":"Units","👥 درباره‌ی ما":"👥 About us","درباره‌ی ما":"About us","🔒 حریم خصوصی و قوانین":"🔒 Privacy and terms","برای دیدن نمودار، حداقل دو ثبت لازمه.":"At least two entries are needed to show a chart.","کمترین":"Lowest","بیشترین":"Highest","روند و نمودارها":"Trends and charts","بر اساس ثبت‌های خودت":"Based on your own logs","۳ ماه":"3 months","۶ ماه":"6 months","۱۲ ماه":"12 months","🩸 طول پریودها":"🩸 Period lengths","🌡️ دمای پایه":"🌡️ Basal temperature","😣 درد":"😣 Pain","💧 آب":"💧 Water","❤️ فشار خون (بالا و پایین)":"❤️ Blood pressure (systolic and diastolic)","آخرین:":"Latest:","این نمودارها فقط روی همین گوشی ساخته می‌شن و جای نظر پزشک رو نمی‌گیرن.":"These charts are built only on this phone and do not replace a doctor's opinion.","فایل آماده شد":"File ready","📤 خروجی داده‌ها":"📤 Export data","ثبت‌هات رو به‌صورت فایل CSV (قابل باز شدن در اکسل و گوگل‌شیت) بگیر یا گزارش چاپی/PDF بساز. فایل‌ها فقط روی گوشی خودت ذخیره می‌شن.":"Export your logs as a CSV file (opens in Excel and Google Sheets) or create a printable/PDF report. Files are saved only on your phone.","📥 ثبت‌های روزانه (CSV)":"📥 Daily logs (CSV)","📥 فشار و قند (CSV)":"📥 Pressure and sugar (CSV)","📄 گزارش PDF برای پزشک":"📄 PDF report for your doctor","📈 روند و نمودارها":"📈 Trends and charts","طول چرخه، وزن، دما، درد، خواب، فشار و قند خون در ۳ تا ۱۲ ماه اخیر.":"Cycle length, weight, temperature, pain, sleep, blood pressure and sugar over the last 3 to 12 months.","دیدن نمودارها":"View charts","جعبه ابزار":"Toolbox","روزه و قضا":"Fasting and make-up days","یادآور روش پیشگیری":"Contraception reminder","بررسی PCOS":"PCOS check","روزهای بدهکار":"Days owed","قضا شده":"Made up","مانده":"Remaining","➕ یک روز بدهکار":"➕ One day owed","➖ کم کردن":"➖ Reduce","✅ یک روز قضا شد":"✅ One day made up","↩️ برگردوندن":"↩️ Undo","محاسبه از پریودهای ثبت‌شده":"Calculate from logged periods","روزهای پریود ثبت‌شده‌ات که در ماه رمضون افتاده:":"Your logged period days that fell in Ramadan:","الان ماه رمضانه.":"It is Ramadan now.","رمضون بعدی تقریباً:":"Next Ramadan approximately:","تاریخ تقویم قمری تقریبیه و ممکنه با رؤیت هلال یک روز فرق کنه.":"The lunar calendar date is approximate and may differ by a day with moon sighting.","🌙 روزه و قضا":"🌙 Fasting and make-up days","شمارنده‌ی روزهای روزه‌ای که به‌خاطر پریود نگرفتی و روزهایی که قضا کردی. احکام دقیق رو از مرجع تقلید خودت بپرس؛ این بخش فقط شمارنده‌ست.":"A counter for fasting days you missed because of your period and days you made up. Ask your own religious authority for exact rulings; this section is only a counter.","🧹 صفر کردن شمارنده":"🧹 Reset counter","هفته‌ی ۱ تا ۴":"Weeks 1 to 4","تخمک بارور می‌شه و جنین توی دیواره‌ی رحم لانه می‌کنه. ساختار اولیه‌ی دستگاه عصبی شروع به شکل گرفتن می‌کنه.":"The egg is fertilized and the embryo implants in the uterine wall. The early structure of the nervous system begins to form.","ممکنه پریودت عقب بیفته و خستگی، حساسیت سینه یا لکه‌بینی خفیف داشته باشی. خیلی‌ها هنوز نمی‌دونن باردارن.":"Your period may be late and you may have fatigue, breast tenderness or light spotting. Many people don't yet know they are pregnant.","با تست بارداری مطمئن شو و به پزشک یا ماما مراجعه کن. اسید فولیک و هر مکملی رو فقط طبق نظر پزشک بخور و سیگار، قلیان و الکل رو کنار بذار.":"Confirm with a pregnancy test and see a doctor or midwife. Take folic acid and any supplement only on your doctor's advice, and stop smoking, hookah and alcohol.","هفته‌ی ۵ تا ۸":"Weeks 5 to 8","قلب شروع به تپیدن می‌کنه و جوانه‌ی دست و پا و اندام‌های اصلی ساخته می‌شن.":"The heart starts to beat and the buds of arms and legs and the main organs form.","تهوع، خستگی، تکرر ادرار و حساسیت به بو شایعه.":"Nausea, fatigue, frequent urination and sensitivity to smells are common.","وعده‌های کوچیک و مکرر بخور و مایعات کافی بنوش. ویزیت اول و سونوگرافی رو طبق نظر پزشک انجام بده. استفراغ شدید که نذاره آب بخوری نیاز به مراجعه داره.":"Eat small, frequent meals and drink enough fluids. Have your first visit and ultrasound as your doctor advises. Severe vomiting that stops you keeping water down needs medical care.","هفته‌ی ۹ تا ۱۲":"Weeks 9 to 12","اندام‌های اصلی شکل گرفتن، انگشت‌ها جدا می‌شن و جنین شروع به حرکت می‌کنه (هنوز حسش نمی‌کنی).":"The main organs have formed, fingers separate and the baby starts to move (you can't feel it yet).","تهوع معمولاً آخر این دوره بهتر می‌شه و انرژی کم‌کم برمی‌گرده.":"Nausea usually improves toward the end of this stage and energy gradually returns.","آزمایش‌ها و غربالگری سه‌ماهه‌ی اول (حدود هفته‌ی ۱۱ تا ۱۳) رو با پزشک هماهنگ کن و تغذیه‌ی متنوع داشته باش.":"Arrange first-trimester tests and screening (around weeks 11 to 13) with your doctor and eat a varied diet.","هفته‌ی ۱۳ تا ۱۶":"Weeks 13 to 16","دوران سه‌ماهه‌ی دوم شروع می‌شه. جنین سریع رشد می‌کنه و حرکت‌هاش بیشتر می‌شه.":"The second trimester begins. The baby grows quickly and moves more.","تهوع کمتر و اشتها بیشتر می‌شه و شکمت کم‌کم دیده می‌شه.":"Nausea eases, appetite increases and your belly gradually begins to show.","غذاهای آهن‌دار و کلسیم‌دار بخور، ورزش سبک مثل پیاده‌روی رو طبق نظر پزشک ادامه بده و دندان‌پزشکی رو عقب نندازه.":"Eat iron- and calcium-rich foods, continue light exercise like walking as your doctor advises, and don't postpone dental care.","هفته‌ی ۱۷ تا ۲۰":"Weeks 17 to 20","جنین شنوایی پیدا می‌کنه و حدود هفته‌ی ۱۶ تا ۲۲ ممکنه اولین حرکت‌هاش رو حس کنی.":"The baby develops hearing and you may feel the first movements around weeks 16 to 22.","ممکنه درد خفیف کناره‌ی شکم یا گرفتگی بینی داشته باشی.":"You may have mild pain at the sides of your belly or a stuffy nose.","سونوگرافی تشخیص ناهنجاری (معمولاً هفته‌ی ۱۸ تا ۲۲) رو انجام بده و به پهلو بخواب.":"Have the anomaly scan ultrasound (usually weeks 18 to 22) and sleep on your side.","هفته‌ی ۲۱ تا ۲۴":"Weeks 21 to 24","ریه‌ها در حال رشدن و حرکت‌های جنین منظم‌تر می‌شه.":"The lungs are developing and the baby's movements become more regular.","کمردرد، ورم پا و ترک پوست شایع می‌شه.":"Back pain, swollen feet and stretch marks become common.","کفش راحت بپوش، پاها رو بالا بذار و آزمایش غربالگری دیابت بارداری (حدود هفته‌ی ۲۴ تا ۲۸) رو با پزشک هماهنگ کن.":"Wear comfortable shoes, put your feet up and arrange gestational diabetes screening (around weeks 24 to 28) with your doctor.","هفته‌ی ۲۵ تا ۲۸":"Weeks 25 to 28","جنین چشم‌هاش رو باز می‌کنه و وزن می‌گیره. از هفته‌ی ۲۸ سه‌ماهه‌ی سوم شروع می‌شه.":"The baby opens its eyes and gains weight. The third trimester begins at week 28.","سوزش سر دل، گرفتگی عضله‌ی پا و تنگی نفس خفیف شایعه.":"Heartburn, leg cramps and mild shortness of breath are common.","تست دیابت و در صورت لزوم بررسی گروه خونی و Rh رو انجام بده و شمردن حرکت جنین رو طبق دستور پزشک شروع کن.":"Have the diabetes test and, if needed, a blood group and Rh check, and start counting baby movements as your doctor instructs.","هفته‌ی ۲۹ تا ۳۲":"Weeks 29 to 32","مغز جنین به سرعت رشد می‌کنه و استخوان‌ها محکم‌تر می‌شن.":"The baby's brain grows rapidly and bones get stronger.","خستگی برمی‌گرده و ممکنه انقباض‌های بی‌درد تمرینی (براکستون هیکس) حس کنی.":"Fatigue returns and you may feel painless practice contractions (Braxton Hicks).","کلاس آمادگی زایمان برو، نشانه‌های خطر رو بلد باش و برنامه‌ی رفت‌وآمد بیمارستان رو مشخص کن.":"Attend childbirth classes, know the warning signs and plan how you will get to the hospital.","هفته‌ی ۳۳ تا ۳۶":"Weeks 33 to 36","معمولاً سر جنین پایین می‌آد و ریه‌ها کامل‌تر می‌شن.":"The baby's head usually moves down and the lungs mature.","تکرر ادرار، ورم و مشکل خواب بیشتر می‌شه.":"Frequent urination, swelling and trouble sleeping increase.","ویزیت‌ها معمولاً مکرر‌تر می‌شن. آزمایش‌هایی که پزشک می‌خواد (مثل کشت استرپتوکوک گروه B حدود هفته‌ی ۳۶) رو انجام بده.":"Visits usually become more frequent. Have the tests your doctor requests (such as a group B strep culture around week 36).","هفته‌ی ۳۷ تا ۴۰":"Weeks 37 to 40","از هفته‌ی ۳۷ جنین ترم حساب می‌شه و برای تولد آماده‌ست.":"From week 37 the baby is considered full term and ready for birth.","ممکنه سنگینی لگن، انقباض‌های بیشتر و ترشح مخاطی داشته باشی.":"You may have pelvic heaviness, more contractions and mucus discharge.","ساک بیمارستان رو آماده کن. انقباض منظم هر ۵ دقیقه، آب‌ریزش، خونریزی یا کم شدن حرکت جنین یعنی فوراً به بیمارستان برو.":"Pack your hospital bag. Regular contractions every 5 minutes, water breaking, bleeding or reduced baby movement means go to the hospital right away.","هفته‌ی ۴۱ به بعد":"Week 41 and beyond","بارداری از موعد گذشته و پزشک وضعیت جنین رو بیشتر زیر نظر می‌گیره.":"The pregnancy is past its due date and your doctor monitors the baby more closely.","بی‌قراری و نگرانی در این دوران طبیعیه.":"Restlessness and worry are normal at this time.","به ویزیت‌ها و مانیتورینگ‌های پزشک پایبند باش و درباره‌ی برنامه‌ی زایمان با پزشک صحبت کن.":"Keep to your doctor's visits and monitoring and talk to your doctor about the birth plan.","👶 جنین":"👶 Baby","🤰 تو":"🤰 You","✅ مراقبت":"✅ Care","🤱 راهنمای مرحله‌ای بارداری":"🤱 Pregnancy stage guide","نشانه‌های خطر":"Warning signs","خونریزی، درد شدید شکم، سردرد شدید با تاری دید، تب، آب‌ریزش، ورم ناگهانی صورت و دست‌ها یا کم شدن حرکت جنین یعنی فوراً به پزشک یا اورژانس مراجعه کن.":"Bleeding, severe belly pain, severe headache with blurred vision, fever, fluid leaking, sudden swelling of the face and hands or reduced baby movement means see a doctor or emergency right away.","این راهنما آموزشیه و جای ویزیت‌های بارداری نیست.":"This guide is educational and does not replace pregnancy checkups.","آمپول سه‌ماهه":"3-month injection","حلقه‌ی واژینال":"Vaginal ring","پچ":"Patch","IUD (آی‌یو‌دی)":"IUD","ایمپلنت":"Implant","وقت آمپول پیشگیری رسیده 💉":"Time for your contraceptive injection 💉","وقت برداشتن یا عوض کردن حلقه رسیده ⭕":"Time to remove or change your ring ⭕","وقت عوض کردن پچ رسیده 🩹":"Time to change your patch 🩹","وقت بررسی یا تعویض IUD رسیده 🔩":"Time to check or replace your IUD 🔩","وقت بررسی یا تعویض ایمپلنت رسیده 📍":"Time to check or replace your implant 📍","دیر شده:":"Overdue:","تاریخ گذاشتن":"Date placed","تاریخ آخرین مصرف یا تعویض":"Date of last use or change","تاریخ انقضا یا تعویض (طبق برگه‌ی پزشک)":"Expiry or replacement date (per your doctor's sheet)","امروز تعویض/تزریق شد":"Changed/injected today","موعد بعدی":"Next due","بعد از هر پریود، طبق آموزش پزشک وجود نخ IUD رو چک کن و اگه حس نکردی یا درد شدید داشتی به پزشک مراجعه کن.":"After each period, check for the IUD strings as your doctor taught you, and if you can't feel them or have severe pain, see a doctor.","🛡️ یادآور روش پیشگیری":"🛡️ Contraception reminder","برای آمپول، حلقه، پچ، IUD و ایمپلنت تاریخ بعدی رو حساب می‌کنه و یادآوری می‌ده. فاصله‌ها طبق معمول حساب می‌شن؛ برگه‌ی داروی خودت و نظر پزشک مقدمه.":"Calculates the next date for injection, ring, patch, IUD and implant and reminds you. Intervals are the usual ones; your own medication leaflet and your doctor's advice come first.","نوار بهداشتی":"Pad","تامپون":"Tampon","کاپ قاعدگی":"Menstrual cup","وقت عوض کردن نوار رسیده 🩸":"Time to change your pad 🩸","وقت عوض کردن تامپون رسیده 🧷":"Time to change your tampon 🧷","وقت خالی کردن کاپ رسیده 🥣":"Time to empty your cup 🥣","وقت تعویضه":"Time to change","نگه داشتن طولانی احتمال عفونت و بو رو بالا می‌بره. تامپون رو حداکثر ۸ ساعت نگه دار.":"Leaving it in too long raises the chance of infection and odor. Keep a tampon in for at most 8 hours.","تعویض‌های زیاد در یک روز":"Many changes in one day","اگه هر ۱ تا ۲ ساعت نوار یا تامپون عوض می‌کنی، به پزشک بگو؛ ممکنه خونریزی زیاد باشه.":"If you change a pad or tampon every 1 to 2 hours, tell a doctor; it may be heavy bleeding.","🔔 یادآور روشنه":"🔔 Reminder on","🔕 یادآور خاموشه":"🔕 Reminder off","🩸 تعویض نوار، تامپون و کاپ":"🩸 Pad, tampon and cup changes","از آخرین تعویض:":"Since last change:","امروز عوض شده:":"Changed today:","بار":"times","الان عوض کردم":"I changed it now","چرخه‌های ۶ ماه اخیر بیشتر از ۳۵ روز یا نامنظم بوده":"Cycles in the last 6 months were longer than 35 days or irregular","چند بار «جوش» ثبت کردی":"You logged \"acne\" several times","مشکل مو (ریزش یا رشد زیاد) ثبت کردی":"You logged a hair problem (loss or excess growth)","BMI بالای ۲۵ هست":"BMI is above 25","چند نشونه با هم دیده می‌شه":"Several signs appear together","نشونه‌ی مشخصی دیده نمی‌شه":"No clear sign is seen","پیشنهاد می‌شه با پزشک زنان درباره‌ی بررسی PCOS (معاینه، آزمایش هورمون و سونوگرافی) صحبت کنی.":"It is suggested to talk to a gynecologist about checking for PCOS (exam, hormone tests and ultrasound).","به ثبت منظم ادامه بده. اگه چرخه‌هات نامنظم موند، با پزشک صحبت کن.":"Keep logging regularly. If your cycles stay irregular, talk to a doctor.","🔍 بررسی نشانه‌های PCOS":"🔍 PCOS signs check","بر اساس ثبت‌هات چند نشونه‌ی شایع رو کنار هم می‌ذاره. این تشخیص نیست و فقط کمک می‌کنه بدونی کی بهتره با پزشک حرف بزنی.":"Based on your logs it puts several common signs side by side. This is not a diagnosis and only helps you know when it's best to talk to a doctor.","شایع‌ترین:":"Most common:","روز ثبت":"days logged","شروع پریود":"period starts","📅 خلاصه‌ی ماه گذشته آماده‌ست":"📅 Last month's summary is ready","برای دیدن روند ماهانه بزن.":"Tap to see the monthly trend.","تهران":"Tehran","مشهد":"Mashhad","اصفهان":"Isfahan","شیراز":"Shiraz","تبریز":"Tabriz","اهواز":"Ahvaz","قم":"Qom","کرمان":"Kerman","رشت":"Rasht","یزد":"Yazd","زاهدان":"Zahedan","ارومیه":" ['💊','قرص ضدبارداری و پیشگیری',['قرص‌های ترکیبی باید هر روز سر یه ساعت مصرف بشن. اگه یه قرص رو فراموش کردی، دستور برگه‌ی همون قرص رو بخون یا از داروساز بپرس؛ چون بسته به نوع قرص و هفته‌ی مصرف فرق می‌کنه.','قرص از بیماری‌های مقاربتی محافظت نمی‌کنه. انتخاب روش پیشگیری باید با پزشک باشه، مخصوصاً اگه سیگار می‌کشی، میگرن با اورا داری، فشار خون بالا داری یا سابقه‌ی لخته داری. تاریخ‌های باروری این برنامه جای روش پیشگیری نیست.']],
['🚑','کی حتماً باید به پزشک مراجعه کنم؟',['فوری (اورژانس): درد شدید ناگهانی شکم، خونریزی خیلی شدید با سرگیجه یا غش، خونریزی در بارداری، تب بالا همراه با ضعف و بثورات در حین استفاده از تامپون، افکار آسیب به خود.','در چند روز آینده: پریود نیامده بیش از ۳ ماه، خونریزی بیش از ۷ روز، درد شدید مکرر، لکه‌بینی بین دو پریود، ترشح یا بوی غیرعادی، توده در سینه، یا هر تغییر ناگهانی و نگران‌کننده در چرخه‌ت.']]];

ART.push(...[["🧬","اندومتریوز",["اندومتریوز یعنی بافتی شبیه جدار رحم بیرون از رحم (مثلاً روی تخمدان‌ها یا داخل لگن) رشد کنه. این بافت با هورمون‌های چرخه تحریک می‌شه و می‌تونه درد و التهاب ایجاد کنه.","نشانه‌های شایع: درد خیلی شدید پریود که با مسکن ساده بهتر نمی‌شه، درد لگن بین دو پریود، درد موقع رابطه، درد هنگام اجابت مزاج یا ادرار در روزهای پریود، خونریزی زیاد و گاهی مشکل در باردار شدن. شدت درد همیشه با شدت بیماری یکی نیست.","تشخیص با پزشک زنان و معمولاً با معاینه، سونوگرافی یا MRI و گاهی روش‌های جراحی تشخیصی انجام می‌شه. درمان‌ها شامل داروهای مسکن، هورمون‌درمانی و در بعضی موارد جراحیه. اگه درد پریودت زندگی روزمره‌ات رو مختل می‌کنه، نذار «طبیعیه» بشه؛ ثبت دردها تو این برنامه رو به پزشک نشون بده."]],["🫧","فیبروم و پولیپ رحم",["فیبروم تومورهای خوش‌خیم عضلانی رحمه و پولیپ زائده‌ی کوچیک روی جدار رحم یا دهانه‌ی رحمه. هر دو شایعن و بیشترشون سرطانی نیستن.","ممکنه هیچ علامتی نداشته باشن یا باعث خونریزی زیاد، پریود طولانی، لکه‌بینی بین دو پریود، فشار یا سنگینی لگن، تکرار ادرار و گاهی کم‌خونی بشن.","تشخیص معمولاً با سونوگرافیه. اگه علامتی ندارن، ممکنه فقط تحت نظر باشن. اگه خونریزی زیاد یا فشار لگن داری، پزشک درمان دارویی یا روش‌های دیگه رو پیشنهاد می‌کنه. خونریزی بعد از یائسگی همیشه باید بررسی بشه."]],["🦋","تیروئید و چرخه‌ی قاعدگی",["تیروئید غده‌ایه که سرعت سوخت‌وساز بدن رو تنظیم می‌کنه. کم‌کاری یا پرکاری تیروئید می‌تونه پریود رو نامنظم، سنگین، سبک یا حتی قطع کنه.","نشانه‌های کم‌کاری: خستگی، سردی‌پذیری، افزایش وزن، یبوست، خشکی پوست، ریزش مو و افسردگی. نشانه‌های پرکاری: تپش قلب، لرزش دست، کاهش وزن، گرمازدگی، اضطراب و بی‌خوابی.","آزمایش خون ساده (TSH و در صورت نیاز T4) تشخیص می‌ده. اگه پریودت نامنظمه یا چند نشونه‌ی بالا رو داری، چک تیروئید رو با پزشک مطرح کن. درمان معمولاً با قرص‌ها و پیگیری منظمه."]],["🩸","کم‌خونی فقر آهن",["در دوران قاعدگی مقداری آهن از دست می‌ره و اگه خونریزی زیاد باشه یا آهن غذا کم باشه، کم‌خونی فقر آهن شایعه. این مشکل در دختران نوجوان و زنان با خونریزی سنگین بیشتر دیده می‌شه.","نشانه‌ها: خستگی، رنگ‌پریدگی، سرگیجه، تپش قلب، تنگی نفس با فعالیت سبک، ریزش مو، شکننده شدن ناخن، سرد بودن دست و پا و میل به خوردن یخ یا خاک. گاهی فریتین پایینه حتی وقتی هموگلوبین هنوز طبیعیه.","تشخیص با آزمایش خون (هموگلوبین و فریتین) انجامه. غذاهای آهن‌دار مثل گوشت قرمز، جگر، عدس، لوبیا و سبزی‌های تیره با ویتامین C (لیمو، گوجه) بهتر جذب می‌شن. چای و قهوه جذب آهن رو کم می‌کنن. قرص آهن رو فقط با نظر پزشک و با دوز تعیین‌شده مصرف کن، چون زیادش هم مشکل‌سازه."]],["☀️","ویتامین D، B12 و کلسیم",["کمبود ویتامین D تو ایران شایعه، مخصوصاً با پوشش زیاد، کار داخل ساختمون و آفتاب کم. نشانه‌ها می‌تونه خستگی، درد استخوان و عضله و ضعف باشه، ولی گاهی هیچ نشانه‌ای نداره.","ویتامین B12 تو گوشت، ماهی، تخم‌مرغ و لبنیات هست؛ گیاه‌خوارها بیشتر در خطر کمبودن. کمبودش می‌تونه خستگی، گزگز دست و پا، تغییر خلق و کم‌خونی بده. کلسیم هم از لبنیات، ماهی کوچیک با استخوان و سبزی‌های برگ‌دار تأمین می‌شه.","قبل از مصرف مکمل، آزمایش بده و دوز رو پزشک تعیین کنه؛ مصرف خودسرانه‌ی دوزهای بالا می‌تونه مضر باشه. ۱۰ تا ۲۰ دقیقه آفتاب ملایم چند بار در هفته و رژیم متنوع پایه‌ی خوبیه."]],["🎗️","سلامت پستان و خودآزمایی",["حساسیت و درد پستان قبل از پریود شایعه و به هورمون‌ها ربط داره. ماه‌به‌ماه و بعد از پریود، پستان‌ها معمولاً نرم‌تر می‌شن.","خودآزمایی ماهانه رو چند روز بعد از پایان پریود انجام بده (وقتی پستان‌ها حساسیت کمتری دارن): جلوی آینه شکل، اندازه و پوست رو نگاه کن، بعد با نوک سه انگشت و حرکت دایره‌ای، کل پستان و زیر بغل رو لمس کن.","اگه توده‌ی جدید و سفت، تغییر شکل یا فرورفتگی پوست، ترشح خونی یا شفاف از نوک، قرمزی یا زخم یا درد یک‌طرفه‌ی مداوم دیدی، بدون نگرانی ولی بدون تأخیر به پزشک مراجعه کن. بیشتر توده‌ها خوش‌خیمن، ولی فقط پزشک می‌تونه مطمئن بشه. غربالگری با ماموگرافی طبق سن و سابقه‌ی خانوادگی با نظر پزشکه."]],["🧫","عفونت‌های واژینال",["شایع‌ترین انواع: عفونت قارچی (خارش و سوزش، ترشح غلیظ و سفید شبیه پنیر)، واژینوز باکتریال (بوی ماهی‌مانند و ترشح خاکستری) و عفونت‌های مقاربتی. ترشح شفاف یا سفید بدون بو و بدون خارش معمولاً طبیعیه.","کمک‌ها: لباس زیر نخی، پرهیز از شوینده‌ی معطر و دوش واژینال، خشک نگه داشتن ناحیه، عوض کردن زود لباس خیس، و شستشو از جلو به عقب. بعد از مصرف آنتی‌بیوتیک ممکنه عفونت قارچی بشه.","قبل از مصرف دارو (خصوصاً کرم و قرص بدون نسخه) تشخیص با پزشک بهتره، چون علائم این عفونت‌ها شبیه همه و درمانشون فرق داره. اگه تب، درد لگن یا ترشح با بوی بد و رنگ سبز/زرد داری، یا باردار هستی، حتماً ویزیت شو."]],["🚽","عفونت ادراری (سیستیت)",["عفونت مثانه در زنان شایعه چون مجرای ادراری کوتاهه. نشانه‌ها: سوزش هنگام ادرار، نیاز مکرر و فوری به دستشویی، درد پایین شکم و گاهی ادرار کدر یا بدبو یا خونی.","کمک‌ها: آب کافی، خالی کردن مثانه بعد از رابطه، شستشو از جلو به عقب، و پرهیز از نگه داشتن ادرار. این‌ها پیشگیری رو کمک می‌کنن ولی عفونت فعال معمولاً به آنتی‌بیوتیک نیاز داره که باید پزشک تجویز کنه.","اگه تب، لرز، درد پهلو، تهوع و استفراغ داری یا باردار هستی، این می‌تونه نشونه‌ی عفونت کلیه باشه و نیاز به مراجعه‌ی فوری داره. علائم عفونت ادراری رو با علائم پریود یا عفونت واژینال اشتباه نگیر."]],["🔬","غربالگری پاپ‌اسمیر و HPV",["پاپ‌اسمیر و تست HPV سلول‌های دهانه‌ی رحم رو بررسی می‌کنن تا تغییرات پیش‌سرطانی خیلی زود پیدا بشن. سرطان دهانه‌ی رحم تقریباً همیشه با غربالگری منظم قابل پیشگیریه.","معمولاً از حدود ۲۱ سالگی یا بعد از شروع رابطه، طبق نظر پزشک، غربالگری شروع می‌شه و فاصله‌ی انجامش به سن و نتیجه‌ی قبلی بستگی داره. بهتره آزمایش رو وسط پریود انجام ندی و ۲۴ تا ۴۸ ساعت قبلش رابطه، دوش واژینال یا کرم واژینال نداشته باشی.","واکسن HPV در سنین نوجوانی و جوانی با نظر پزشک موجوده و از چند نوع پرخطر ویروس محافظت می‌کنه. نتیجه‌ی غیرطبیعی یعنی نیاز به پیگیری، نه لزوماً سرطان."]],["🧪","تست بارداری و نشانه‌های اولیه",["اولین و شایع‌ترین نشانه‌ی بارداری، عقب افتادن پریوده. نشانه‌های دیگه: حساسیت پستان، تهوع، خستگی، تکرر ادرار و گاهی لکه‌بینی خفیف.","تست خونگی هورمون hCG ادرار رو می‌سنجه. بعد از چند روز تأخیر پریود دقیق‌تره و بهتره با ادرار صبحگاهی انجام بشه. اگه منفی بود ولی پریود نیومد، ۳ تا ۷ روز بعد دوباره امتحان کن. تست خون دقیق‌تر و زودتره.","اگه مثبت بود، با پزشک یا ماما قرار بذار. مصرف اسید فولیک و هر مکمل دیگه رو با پزشک هماهنگ کن. درد شدید یک‌طرفه‌ی شکم، سرگیجه یا غش و خونریزی در این زمان اورژانسیه."]],["🌱","آماده‌سازی برای بارداری",["اگه قصد بارداری داری، ۳ ماه قبل با پزشک مشورت کن: چک وضعیت واکسن‌ها، تیروئید، قند و کم‌خونی، داروهای فعلی و مصرف اسید فولیک (با دوز تعیین‌شده‌ی پزشک).","سیگار، قلیان و الکل رو کنار بذار، وزن متعادل داشته باش، کافئین رو محدود کن و ورزش سبک و منظم داشته باش. تو این برنامه می‌تونی روزهای باروری، دمای پایه و ترشحات رو ثبت کنی.","حدود ۸۵٪ زوج‌ها ظرف یک سال به بارداری می‌رسن. اگه زیر ۳۵ سالی و یک سال تلاش بی‌نتیجه بود (یا بالای ۳۵ و ۶ ماه) برای بررسی مراجعه کن؛ بررسی باید برای هر دو نفر انجام بشه."]],["🤱","پریود بعد از زایمان و شیردهی",["بعد از زایمان، خونریزی نفاسی چند هفته طول می‌کشه. اولین پریود واقعی بسته به شیردهی فرق می‌کنه: در شیردهی انحصاری ممکنه ماه‌ها نیاد، ولی تخمک‌گذاری می‌تونه قبل از اولین پریود اتفاق بیفته و باردار شدن ممکنه.","چرخه‌ها در ماه‌های اول بعد از برگشت ممکنه نامنظم، کوتاه یا بلند باشن و کم‌کم تنظیم می‌شن. تو این دوره پیش‌بینی‌های برنامه کمتر دقیقه.","خونریزی خیلی زیاد (پر شدن نوار هر ساعت)، تب، ترشح بدبو، درد شدید شکم یا لخته‌های درشت بعد از زایمان نیاز به مراجعه‌ی فوریه. غمگینی و اضطراب شدید که بیشتر از دو هفته طول بکشه رو هم به پزشک بگو؛ افسردگی بعد از زایمان قابل درمانه."]],["🍂","پیش‌یائسگی و یائسگی",["یائسگی یعنی ۱۲ ماه پیاپی بدون پریود (معمولاً حدود ۴۵ تا ۵۵ سالگی). چند سال قبلش، دوره‌ی پیش‌یائسگی با نامنظمی چرخه، تغییر مقدار خونریزی و نوسان هورمونی شروع می‌شه.","علائم شایع: گرگرفتگی، تعریق شبانه، بی‌خوابی، تغییر خلق، خشکی واژن، کاهش میل جنسی و مشکل تمرکز. این علائم قابل مدیریتن: لباس لایه‌لایه، کم کردن کافئین و الکل، ورزش، خواب منظم و در صورت نیاز درمان هورمونی یا غیرهورمونی با نظر پزشک.","تو یائسگی خطر پوکی استخوان و بیماری قلبی بالا می‌ره؛ کلسیم، ویتامین D، ورزش وزنه‌ای و چک‌آپ منظم مهمه. هر خونریزی بعد از یائسگی رو حتماً به پزشک نشون بده. اگه قبل از ۴۰ سالگی پریودت قطع شد هم باید بررسی بشه."]],["🌷","اولین پریود (دوران بلوغ)",["اولین پریود معمولاً بین ۹ تا ۱۶ سالگی، حدود ۲ تا ۳ سال بعد از شروع رشد سینه‌ها اتفاق می‌افته. چرخه‌ها تو ۱ تا ۲ سال اول معمولاً نامنظمن و این طبیعیه.","آماده باش: نوار بهداشتی یا لباس زیر مخصوص تو کیف داشته باش، خونریزی رو تو برنامه ثبت کن و یاد بگیر که تغییر نوار هر ۴ تا ۶ ساعت لازمه. درد خفیف، تغییر خلق و خستگی عادیه.","اگه تا ۱۵ سالگی پریود نیومد، خونریزی خیلی زیاد یا خیلی طولانی داره، درد غیرقابل تحمل داره، یا چرخه بعد از دو سال هنوز خیلی نامنظمه، با پزشک صحبت کن. به نوجوان‌ها بگو چیزی برای شرم‌ساری نیست و می‌تونن از مادر یا یه بزرگ‌تر مورد اعتماد کمک بگیرن."]],["🏃‍♀️","ورزش و چرخه‌ی قاعدگی",["ورزش منظم درد پریود، نفخ و تغییر خلق رو کم می‌کنه. تو نیمه‌ی اول چرخه انرژی معمولاً بالاتره و برای تمرین سنگین‌تر مناسبه؛ تو روزهای پریود و PMS پیاده‌روی، یوگا و کشش بهتره.","ورزش خیلی سنگین همراه با کم‌خوری می‌تونه پریود رو نامنظم یا قطع کنه و به استخوان‌ها آسیب بزنه. اگه پریودت قطع شد، انرژی دریافتی رو بیشتر کن و به پزشک بگو.","گوش دادن به بدن مهمه: سرگیجه، درد قفسه‌ی سینه یا ضعف شدید نشونه‌ی توقفه. قبل و بعد از ورزش گرم کردن و سرد کردن، آب کافی و خواب ۷ تا ۹ ساعت رو فراموش نکن."]],["🧠","اضطراب و افسردگی در دختران و زنان",["نوسان خلق قبل از پریود شایعه، ولی غم عمیق، بی‌علاقگی به همه‌چیز، تغییر شدید خواب و اشتها، احساس بی‌ارزشی یا ناامیدی که بیشتر از دو هفته طول بکشه ممکنه افسردگی باشه. اضطراب با نگرانی کنترل‌نشدنی، تپش قلب، لرزش و بی‌خوابی خودش رو نشون می‌ده.","کمک‌ها: خواب منظم، حرکت و آفتاب، وقت گذاشتن با آدم‌های امن، محدود کردن کافئین و اخبار، و حرف زدن با کسی که بهش اعتماد داری. مشاوره و روان‌درمانی و گاهی دارو مؤثر و قابل‌اعتمادن، و کمک گرفتن نشونه‌ی ضعف نیست.","اگه افکار آسیب زدن به خودت یا مردن داری، همین الان با یه نفر مورد اعتماد حرف بزن. تو ایران می‌تونی با اورژانس اجتماعی (۱۲۳) تماس بگیری و اگه خطر فوریه با ۱۱۵. تو تنها نیستی."]],["💊","مصرف ایمن مسکن‌ها",["برای دردهای پریود، مسکن‌های ضدالتهاب معمولی (مثل ایبوپروفن) اغلب مؤثرن، ولی بهتره بعد از غذا مصرف بشن. اگه زخم معده، آسم حساس به مسکن، بیماری کلیه، حساسیت دارویی یا بارداری داری، بدون نظر پزشک مصرف نکن.","هرگز بیشتر از دوز روی برچسب یا نظر پزشک نخور و چند نوع مسکن رو هم‌زمان بدون مشورت مصرف نکن (مثلاً چند دارو با ماده‌ی مؤثر مشابه). مصرف مداوم روزانه‌ی مسکن نیاز به بررسی علت درد داره.","اگه داروی دیگه‌ای می‌خوری یا بیماری زمینه‌ای داری، از داروساز بپرس. قرص ضدبارداری ترکیبی هم می‌تونه درد و خونریزی رو کم کنه، ولی فقط با تجویز پزشک. برای کودکان زیر ۱۸ سال هم دوز و نوع دارو با پزشک مشخص بشه."]],["🚨","پیشگیری اضطراری (قرص روز بعد)",["پیشگیری اضطراری برای وقتیه که رابطه‌ی بدون محافظت یا شکست روش پیشگیری رخ داده. هرچه زودتر مصرف بشه مؤثرتره؛ بعضی انواعش تا ۳ تا ۵ روز بعد از رابطه اثر دارن ولی با گذشت زمان اثرشون کم می‌شه.","این روش جایگزین روش پیشگیری منظم نیست، سقط‌کننده نیست و از بیماری‌های مقاربتی محافظت نمی‌کنه. ممکنه پریود بعدی چند روز زودتر یا دیرتر بیاد.","برای انتخاب نوع و دوز مناسب با داروساز یا پزشک مشورت کن، مخصوصاً اگه شیر می‌دی یا دارو مصرف می‌کنی. اگه پریودت بیش از یک هفته دیر شد، تست بارداری بزن. استفراغ تا ۲ ساعت بعد از مصرف، یعنی باید با داروساز صحبت کنی."]],["🟤","لکه‌بینی؛ علل و نکات",["لکه‌بینی یعنی خونریزی سبک‌تر از پریود. دلایل شایع: تخمک‌گذاری، شروع یا تغییر قرص‌های هورمونی، لانه‌گزینی جنین (حدود ۶ تا ۱۲ روز بعد از تخمک‌گذاری)، استرس، عفونت یا پولیپ و تغییرات هورمونی.","تاریخ، رنگ و مقدار لکه‌بینی رو تو برنامه ثبت کن (گزینه‌ی لکه‌بینی). این اطلاعات به تشخیص الگو کمک می‌کنه.","اگه لکه‌بینی تکرار می‌شه، بعد از رابطه است، همراه با درد شدید، تب یا بوی بد هست، یا باردار هستی و خونریزی داری، به پزشک مراجعه کن. لکه‌بینی بعد از یائسگی هم همیشه باید بررسی بشه."]],["💆‍♀️","مو و پوست و هورمون‌ها",["تغییرات هورمونی روی پوست و مو اثر می‌ذارن: جوش قبل از پریود، چرب یا خشک شدن پوست و ریزش مو. ریزش مو می‌تونه با کم‌خونی، کمبود آهن یا ویتامین D، تیروئید، استرس و PCOS هم ارتباط داشته باشه.","مراقبت ساده: پوست رو دو بار در روز با شوینده‌ی ملایم بشور، از کرم ضدآفتاب استفاده کن، به جوش‌ها دست نزن، پروتئین و آهن کافی بخور و از کشیدن و حرارت زیاد مو پرهیز کن.","اگه جوش‌های شدید و مقاوم، رشد موی زیاد در صورت یا بدن، ریزش مو بیشتر از معمول، یا پریود نامنظم همراه با این‌ها داری، با پزشک (زنان یا پوست) صحبت کن؛ ممکنه PCOS یا مشکل دیگه‌ای باشه."]],["✅","باورهای غلط درباره‌ی پریود",["«تو پریود نباید حمام کرد یا موی سر شست»: غلطه، حمام و دوش بهداشتیه و حتی درد رو کم می‌کنه. «تو پریود نمی‌شه ورزش کرد»: ورزش سبک تا متوسط مفیده. «پریود خون کثیفه»: خون قاعدگی کثیف نیست؛ خون و بافت جدار رحمه.","«شروع بارداری تو پریود ممکن نیست»: بعید ولی ممکنه، مخصوصاً تو چرخه‌های کوتاه. «ترشح واژن همیشه نشونه‌ی بیماریه»: ترشح طبیعی بخشی از سلامته. «پریود نامنظم تو نوجوانی یعنی نازایی»: معمولاً طبیعیه و با بلوغ تنظیم می‌شه.","«دوش واژینال تمیزکننده‌ست»: برعکس، تعادل طبیعی رو به هم می‌زنه و خطر عفونت رو بالا می‌بره. «درد شدید پریود عادیه و باید تحمل کرد»: درد خیلی شدید عادی نیست و ارزش بررسی داره."]]]);

const MT={s:1,x:0,y:0,f:1,p:new Map(),d0:0,last:0};
function mtApply(){const i=document.getElementById('mti');if(i)i.style.transform=`translate(${MT.x}px,${MT.y}px) scale(${MT.s})`}
function mtClamp(){const c=document.getElementById('mtb'),i=document.getElementById('mti');if(!c||!i)return;const W=c.clientWidth,H=c.clientHeight,w=i.naturalWidth*MT.s,h=i.naturalHeight*MT.s;MT.x=w<=W?(W-w)/2:Math.min(0,Math.max(W-w,MT.x));MT.y=h<=H?(H-h)/2:Math.min(0,Math.max(H-h,MT.y))}
function mtZoomAt(f,cx,cy){const n=Math.min(MT.f*8,Math.max(MT.f,MT.s*f)),k=n/MT.s;MT.x=cx-(cx-MT.x)*k;MT.y=cy-(cy-MT.y)*k;MT.s=n;mtClamp();mtApply()}
function mtFit(){const c=document.getElementById('mtb'),i=document.getElementById('mti');if(!c||!i||!i.naturalWidth)return;MT.f=c.clientWidth/i.naturalWidth;MT.s=MT.f;MT.x=0;MT.y=0;mtClamp();mtApply()}
function mtPinchStart(){const v=[...MT.p.values()];if(v.length>=2)MT.d0=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)}
function mtBtn(v){const c=document.getElementById('mtb');if(!c)return;if(v===0)mtFit();else mtZoomAt(v>0?1.5:1/1.5,c.clientWidth/2,c.clientHeight/2)}
function mtInit(){const c=document.getElementById('mtb'),i=document.getElementById('mti');if(!c||!i)return;MT.p.clear();MT.d0=0;if(i.complete&&i.naturalWidth)mtFit();else i.onload=mtFit;
 c.onpointerdown=e=>{try{c.setPointerCapture(e.pointerId)}catch(x){}MT.p.set(e.pointerId,{x:e.clientX,y:e.clientY});if(MT.p.size===2){mtPinchStart();return}const now=Date.now();if(MT.p.size===1&&now-MT.last<300){const r=c.getBoundingClientRect();mtZoomAt(MT.s>MT.f*1.5?MT.f/MT.s:MT.f*3/MT.s,e.clientX-r.left,e.clientY-r.top)}MT.last=now};
 c.onpointermove=e=>{const o=MT.p.get(e.pointerId);if(!o)return;const r=c.getBoundingClientRect();if(MT.p.size===1){MT.x+=e.clientX-o.x;MT.y+=e.clientY-o.y;o.x=e.clientX;o.y=e.clientY;mtClamp();mtApply()}else if(MT.p.size>=2){o.x=e.clientX;o.y=e.clientY;const v=[...MT.p.values()],d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),mx=(v[0].x+v[1].x)/2-r.left,my=(v[0].y+v[1].y)/2-r.top;if(MT.d0){mtZoomAt(d/MT.d0,mx,my)}MT.d0=d}};
 c.onpointerup=c.onpointercancel=e=>{MT.p.delete(e.pointerId);MT.d0=0;if(MT.p.size===2)mtPinchStart()};

async function kdf(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encPack(obj,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await kdf(pw,salt),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));return JSON.stringify({app:'mahbanoo',enc:1,s:b64(salt),i:b64(iv),d:b64(ct)})}
async function encUnpack(txt,pw){const o=JSON.parse(txt);if(!o.enc)throw 0;const key=await kdf(pw,ub64(o.s)),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.i)},key,ub64(o.d));return JSON.parse(new TextDecoder().decode(pt))}
